  if (s === 4 || s === 12) for (const m of ch) tone(mtof(m), t, st * 0.8, 'square', 0.025, audio.music);   // pah
  const k = ROOM_PLINK[bar % 2][s];
  if (k !== null) tone(mtof((k === 3 ? ch[0] + 12 : ch[k]) + 12), t, st * 0.7, 'square', 0.045, [audio.music, audio.echo]);
  if (s === 4 || s === 12) noiseHit(t, 0.07, 'bandpass', 3200, 0.12, audio.music, 9);                  // clank
  if (s % 2 === 1) noiseHit(t, 0.02, 'highpass', 9000, 0.03, audio.music);                               // tick
  if (s === 6 || s === 14) tone(bar % 2 ? 1500 : 1200, t, 0.04, 'triangle', 0.08, audio.music);          // wood block
  if (bar % 4 === 3 && s === 12) noiseHit(t, 0.5, 'lowpass', 1400, 0.1, audio.music);                   // steam puff
}

// Quiz: thinking music. Tick-tock clock, slow minor chords, soft plucks.
const QUIZ_CHORDS = [[50, 53, 57], [46, 50, 53], [43, 46, 50], [45, 49, 52]];   // Dm Bb Gm A
function playQuiz(i, t, st) {
  const s = i % 16, bar = Math.floor(i / 16), ch = QUIZ_CHORDS[bar % 4];
  if (s % 4 === 0) tone(s % 8 === 0 ? 2000 : 1500, t, 0.03, 'sine', 0.12, audio.music);   // tick, tock
  if (s === 0) for (const m of ch) tone(mtof(m + 12), t, st * 15, 'triangle', 0.05, audio.music);
  if (s === 0 || s === 10) tone(mtof(ch[0] - 12), t, st * 3, 'triangle', 0.4, audio.music);
  if (s === 6 || s === 14) tone(mtof(ch[(bar + s) % 3] + 24), t, st * 1.5, 'square', 0.025, [audio.music, audio.echo]);
}

// Victory: one 3-minute pass. Fanfare, then six rounds of verse + chorus that climb in key, then a big ending.
const VERSE = { chords: [0, 7, 9, 5, 0, 7, 9, 5], lead: [
  [0, null, 4, 7, 12, null, 7, 4], [2, null, 7, 11, 14, null, 11, 7], [9, null, 12, 16, 12, null, 9, 7], [5, null, 9, 12, 9, 7, 5, 4],
  [0, 4, 7, 12, 16, null, 14, 12], [11, null, 14, null, 7, null, 11, 12], [9, 12, 16, null, 19, null, 16, 12], [17, 16, 14, 12, 11, null, 7, null]] };
const CHORUS = { chords: [5, 7, 4, 9, 5, 7, 0, 0], lead: [
  [17, null, 17, 16, 17, null, 21, null], [19, null, 19, 17, 19, null, 23, null], [16, null, 19, 16, 12, null, 16, null], [21, null, 19, 16, 12, null, 9, null],
  [17, 16, 17, 19, 21, null, 17, null], [19, 17, 19, 21, 23, null, 19, null], [24, null, null, 19, 16, null, 12, null], [12, null, null, null, null, null, null, null]] };
const KEYS = [0, 0, 2, 2, 5, 5];   // transpose of each round
// chords: steps above the key root. 0, 5, 7 = major chords (C, F, G); 2, 4, 9 = minor chords (Dm, Em, Am).
function triad(root, minor) { return [root, root + (minor ? 3 : 4), root + 7]; }
function playVictory(i, t, st) {
  const s = i % 16, bar = Math.floor(i / 16);
  if (bar < 4) {   // fanfare: da-da-da-daaa on C, F, G, C
    const root = [48, 53, 55, 60][bar], top = [7, 9, 11, 12][bar] + 60;
    if (s === 0 || s === 3 || s === 6) tone(mtof(top), t, st * 1.5, 'square', 0.05, [audio.music, audio.echo]);
    if (s === 8) { tone(mtof(top + 5), t, st * 7, 'square', 0.05, [audio.music, audio.echo]); for (const m of triad(root, false)) tone(mtof(m), t, st * 7, 'triangle', 0.15, audio.music); }
    if (s === 0 || s === 8) kick(t, 0.5);
    if (bar === 3 && s >= 12) noiseHit(t, 0.06, 'highpass', 2000, 0.12, audio.music);   // drum roll into the song
    return;
  }
  const r = Math.floor((bar - 4) / 16);
  if (r >= KEYS.length) {   // ending: three hits, then one long chord, then silence
    const e = bar - 4 - KEYS.length * 16, key = KEYS[KEYS.length - 1];
    if (e === 0 && (s === 0 || s === 4 || s === 8)) { kick(t, 0.6); for (const m of triad(60 + key, false)) tone(mtof(m), t, st * 2, 'square', 0.04, audio.music); }
    if (e === 1 && s === 0) {
      kick(t, 0.6); noiseHit(t, 1.5, 'highpass', 3000, 0.15, audio.music);
      for (const m of [...triad(48 + key, false), ...triad(60 + key, false), 72 + key]) tone(mtof(m), t, st * 40, m < 60 ? 'triangle' : 'square', m < 60 ? 0.3 : 0.03, [audio.music, audio.echo]);
    }
    return;
  }
  const part = (bar - 4) % 16 < 8 ? VERSE : CHORUS, b = (bar - 4) % 8, key = KEYS[r];
  const root = 48 + part.chords[b] + key, ch = triad(root, [2, 4, 9].includes(part.chords[b]));
  if (s % 2 === 0) tone(mtof((s % 4 === 0 ? ch[0] : ch[0] + 12) - 12), t, st * 1.6, 'triangle', 0.45, audio.music);   // pumping bass
  tone(mtof(ch[s % 3] + 24), t, st * 0.8, 'square', 0.02, audio.music);                                              // arpeggio
  if (s === 0 || s === 8 || (part === CHORUS && (s === 4 || s === 12))) kick(t, 0.5);
  if (s === 4 || s === 12) noiseHit(t, 0.12, 'bandpass', 1800, 0.18, audio.music, 0.8);                            // snare
  if (s % 2 === 0) noiseHit(t, 0.025, 'highpass', 8000, 0.05, audio.music);                                        // hat
  if (s % 2 === 0) {
    const m = part.lead[b][s / 2];
    if (m !== null) {
      let note = 72 + m + key; while (note > 96) note -= 12;
      tone(mtof(note), t, st * 1.8, 'square', 0.04, [audio.music, audio.echo]);
      if (r >= 2) tone(mtof(note - 12), t, st * 1.8, 'triangle', 0.08, audio.music);   // later rounds: a second, lower voice
    }
  }
}

// ---------- effects ----------
// An old dial-up modem: dial tone, three number beeps, then the screeching handshake.
function sfxModem() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime, o = audio.sfx;
  tone(350, t, 0.32, 'sine', 0.07, o); tone(440, t, 0.32, 'sine', 0.07, o);
  [[697, 1209], [770, 1336], [852, 1477]].forEach(([f1, f2], k) => { tone(f1, t + 0.4 + k * 0.1, 0.06, 'sine', 0.07, o); tone(f2, t + 0.4 + k * 0.1, 0.06, 'sine', 0.07, o); });
  for (let k = 0; k < 18; k++) tone(k % 5 === 0 ? 980 : k % 2 ? 1200 : 2100, t + 0.75 + k * 0.03, 0.035, 'square', 0.025, o);
  noiseHit(t + 0.95, 0.45, 'bandpass', 1800, 0.06, o, 3);
  tone(1650, t + 1.25, 0.25, 'sine', 0.03, o, 1500);
}
// A wrong answer or a wrong password: three falling notes.
function sfxWrong() { if (!audio.ctx) return; const t = audio.ctx.currentTime; [440, 392, 311].forEach((f, k) => tone(f, t + k * 0.16, k === 2 ? 0.45 : 0.14, 'square', 0.05, audio.sfx)); }
function sfxBoost() { if (!audio.ctx) return; const t = audio.ctx.currentTime; noiseHit(t, 0.35, 'bandpass', 1200, 0.12, audio.sfx, 2); tone(300, t, 0.3, 'sawtooth', 0.03, audio.sfx, 900); }
// Going through a door: a low slide down into the dark.
function sfxEnter() { if (!audio.ctx) return; const t = audio.ctx.currentTime; tone(220, t, 1.4, 'triangle', 0.08, audio.sfx, 55); noiseHit(t, 1.2, 'lowpass', 500, 0.08, audio.sfx); }
function sfxClick() { if (audio.ctx) tone(1400, audio.ctx.currentTime, 0.03, 'square', 0.03, audio.sfx); }
function sfxHangup() { if (audio.ctx) tone(900, audio.ctx.currentTime, 0.14, 'square', 0.04, audio.sfx, 300); }
function sfxThunk() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  tone(110, t, 0.12, 'sine', 0.25, audio.sfx, 50); noiseHit(t, 0.06, 'lowpass', 900, 0.15, audio.sfx);
}
function sfxWhir() { if (audio.ctx) tone(180, audio.ctx.currentTime, 0.5, 'sawtooth', 0.03, audio.sfx, 420); }
function sfxDoor() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  for (let k = 0; k < 10; k++) noiseHit(t + k * 0.05, 0.04, 'bandpass', 600 + k * 40, 0.08, audio.sfx, 4);
}
function sfxAlarm() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  for (let k = 0; k < 6; k++) tone(k % 2 ? 660 : 880, t + k * 0.16, 0.14, 'square', 0.05, audio.sfx);
}

// ---------- packets: a whoosh per packet, with Doppler and left/right pan ----------
const voices = new Map();
const VOICE_BASE = { chat: 900, hello: 700, syn: 1300, fin: 500, cmd: 1100, log: 1600 };
function makeVoice(p) {
  const a = audio.ctx;
  const src = a.createBufferSource(); src.buffer = audio.noise; src.loop = true;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
  const osc = a.createOscillator(); osc.type = 'sine';
  const og = a.createGain(); og.gain.value = 0.12;
  const gain = a.createGain(); gain.gain.value = 0;
  const pan = a.createStereoPanner ? a.createStereoPanner() : null;
  src.connect(bp); bp.connect(gain); osc.connect(og); og.connect(gain);
  if (pan) { gain.connect(pan); pan.connect(audio.sfx); } else gain.connect(audio.sfx);
  src.start(0, Math.random() * 1.5); osc.start();
  return { src, bp, osc, gain, pan, base: VOICE_BASE[p.kind] || 1000, last: null };
}
function updatePacketSounds(dt) {
  if (!audio.ctx) return;
  const now = audio.ctx.currentTime;
  const live = new Set();
  if (scene.kind === 'world') {
    const ear = { x: robot.x, y: robot.y - 30 };
    const near = packets.map(p => { const pos = packetPos(p); return { p, pos, d: Math.hypot(pos.x - ear.x, pos.y - ear.y) }; })
      .filter(c => c.d < HEAR).sort((a, b) => a.d - b.d).slice(0, 6);
    for (const c of near) {
      live.add(c.p);
      let v = voices.get(c.p);
      if (!v) { v = makeVoice(c.p); voices.set(c.p, v); }
      // Doppler: coming closer → higher pitch, moving away → lower pitch.
      const vr = v.last === null || dt <= 0 ? 0 : (c.d - v.last) / dt;
      v.last = c.d;
      const dop = Math.max(0.5, Math.min(2, SOUND_C / (SOUND_C + vr)));
      const moving = !(paused || c.p.blocked || simTime < c.p.holdUntil);
      const vol = Math.pow(1 - c.d / HEAR, 2) * (moving ? 0.5 : 0.05) * (c.p.kind === 'log' ? 0.5 : 1);
      v.bp.frequency.setTargetAtTime(v.base * dop, now, 0.04);
      v.osc.frequency.setTargetAtTime(v.base * 0.75 * dop, now, 0.04);
      v.gain.gain.setTargetAtTime(vol, now, 0.05);
      if (v.pan) v.pan.pan.setTargetAtTime(Math.max(-1, Math.min(1, (c.pos.x - ear.x) / 500)), now, 0.05);
    }
  }
  for (const [p, v] of voices) {
    if (live.has(p)) continue;
    v.gain.gain.setTargetAtTime(0, now, 0.05); v.src.stop(now + 0.3); v.osc.stop(now + 0.3);
    voices.delete(p);
  }
}

const btnSound = document.getElementById('btnSound');
btnSound.onclick = () => {
  audio.on = !audio.on;
  btnSound.textContent = `Sound: ${audio.on ? 'on' : 'off'}`;
  initAudio();
  if (audio.master) audio.master.gain.setTargetAtTime(audio.on ? 0.7 : 0, audio.ctx.currentTime, 0.05);
};
addEventListener('pointerdown', initAudio);
addEventListener('keydown', initAudio);

// =====================================================================
// LOOP, TOOLBAR, STATUS
// =====================================================================
let paused = false, speed = 1, stepBudget = 0;
const btnPause = document.getElementById('btnPause'), btnStep = document.getElementById('btnStep');
btnPause.onclick = () => {
  paused = !paused;
  btnPause.textContent = paused ? 'Run' : 'Pause';
  btnPause.classList.toggle('on', paused);
  btnStep.disabled = !paused;
};
btnStep.onclick = () => { stepBudget += 0.5; };
document.getElementById('speed').onchange = e => { speed = parseFloat(e.target.value); };
document.getElementById('btnLayout').onclick = resetLayout;

// Maximize: the whole page goes full screen (Esc or the button again leaves it).
const btnMax = document.getElementById('btnMax');
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFull() {
  const el = document.documentElement;
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
btnMax.onclick = toggleFull;
document.getElementById('appTitle').addEventListener('dblclick', toggleFull);   // like a Windows 95 title bar
function onFullChange() {
  const full = isFull();
  btnMax.textContent = full ? '❐' : '□';
  btnMax.title = full ? 'Restore (leave full screen)' : 'Maximize (full screen)';
  document.getElementById('app').classList.toggle('full', full);
}
document.addEventListener('fullscreenchange', onFullChange);
document.addEventListener('webkitfullscreenchange', onFullChange);

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  view.dpr = window.devicePixelRatio || 1;
  view.cw = Math.max(1, r.width); view.ch = Math.max(1, r.height);
  cv.width = Math.round(view.cw * view.dpr); cv.height = Math.round(view.ch * view.dpr);
  view.base = Math.min(view.cw / VIEW_W, view.ch / VIEW_H);
  view.zoom = view.base * (view.mul || 1);
}
// The package view zooms in a little; the zoom eases in and out.
function updateZoom(dt) {
  view.mul = view.mul || 1;
  view.mul += ((pkgRide ? 1.25 : 1) - view.mul) * (1 - Math.exp(-3 * dt));
  view.zoom = view.base * view.mul;
}
new ResizeObserver(() => { resize(); updateCamera(1); render(performance.now()); }).observe(cv.parentElement);
resize();

const st1 = document.getElementById('st1'), st2 = document.getElementById('st2');
function updateStatus() {
  const where = scene.kind === 'inside' ? `inside the ${roomOf().name} of Node ${scene.node}` : robot.ride ? 'riding the cable' : `on Node ${boardAt(robot.x, robot.y) || '?'}`;
  const al = ['A', 'B'].filter(alert).map(n => ` · Node ${n} ON ALERT`).join('');
  const boost = robot.boostWait > 0 ? `boost in ${Math.ceil(robot.boostWait)} s` : 'boost ready';
  st1.textContent = `Simulation: ${paused ? 'paused' : 'running'} · ${speed}× · connection: ${tcp === 'up' ? 'open' : 'none'} · robot: ${where} · ${boost}${al}`;
  const bl = ['A', 'B'].map(n => `${n} ${defense[n].blocks}`).join(', ');
  st2.textContent = `Machines found: ${know.metInst.size}/12 · Questions: ${know.asked.size}/${TOTAL_TOPICS} · Stations seen: ${know.stations.size}/${ALL_STATIONS} · Quizzes passed: ${progress.passed.size}/${ORDER.length} · Blocks: ${bl}`;
}

spawn(scenario());
let lastNow = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  let simDt = paused ? 0 : dt * speed;
  if (paused && stepBudget > 0) { simDt = Math.min(stepBudget, dt * 2); stepBudget -= simDt; }
  if (simDt > 0) {
    simTime += simDt * 1000;
    updatePackets(simDt);
    for (const t of tasks.slice()) if (!t.done) runTask(t);
    tasks = tasks.filter(t => !t.done);
    for (const r of Object.values(ROOMS)) if (r.update) { r.update('A', simDt); r.update('B', simDt); }
    updateSwarm(simDt);
  }
  updateFade(dt);
  updateRide(dt);
  updateGuard(dt);
  updateRobot(dt);
  reveal();
  updateZoom(dt);
  updateCamera(dt);
  updateDialog(dt);
  updatePacketSounds(dt);
  drawAvatars(now);
  updateStatus();
  render(now);
  requestAnimationFrame(frame);
}
if (location.hash === '#inside') enterRoom(P['A.log']);   // shortcut: open the page as index.html#inside to start in the LogWriter
reveal(); snapCamera(); updateStatus(); render(performance.now());
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
</script>
