<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeWorld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --face: #c0c0c0; --light: #dfdfdf; --hi: #ffffff; --lo: #808080; --dk: #000000;
    --navy: #000080; --title2: #1084d0; --desk: #008080; --tip: #ffffe1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--desk); color: #000; overflow: hidden;
    font-family: "Pixelify Sans", monospace; font-size: 15px;
  }
  .win {
    background: var(--face);
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--light);
  }
  .titlebar {
    background: linear-gradient(90deg, var(--navy), var(--title2)); color: #fff;
    font-weight: 600; padding: 3px 4px 3px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .titlebar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.w95 {
    background: var(--face); color: #000; font: inherit; font-size: 14px;
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--light);
    padding: 3px 12px; cursor: pointer;
  }
  button.w95:active, button.w95.on {
    border-color: var(--dk) var(--hi) var(--hi) var(--dk);
    box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--light);
  }
  button.w95:disabled { color: var(--lo); text-shadow: 1px 1px var(--hi); cursor: default; }
  button.w95:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  button.tbtn { padding: 0 6px; font-size: 13px; line-height: 16px; min-width: 22px; }
  .tbtns { display: flex; gap: 2px; flex: none; }
  :fullscreen #app, #app.full { inset: 0; }
  .sunken {
    background: #fff;
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    box-shadow: inset 1px 1px var(--dk);
  }
  #app { position: fixed; inset: 8px; display: flex; flex-direction: column; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px;
    border-bottom: 1px solid var(--lo); box-shadow: 0 1px var(--hi);
  }
  .toolbar label { display: flex; align-items: center; gap: 6px; margin-left: 6px; }
  .toolbar select { font: inherit; font-size: 14px; background: #fff; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
  .hint { margin-left: auto; color: #202020; font-size: 13px; }
  .stage { position: relative; flex: 1; min-height: 0; margin: 4px; }
  .stage #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .statusbar { display: flex; gap: 4px; padding: 3px 4px; font-size: 13px; }
  .statusbar span {
    flex: 1; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  }

  /* dialogue box (JRPG style: robot left, machine right) */
  .dlg {
    position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: 62%;
    display: flex; flex-direction: column;
  }
  .dlg[hidden] { display: none; }
  .drow { display: flex; gap: 12px; padding: 10px; min-height: 0; align-items: flex-start; }
  .avatar { flex: none; width: 136px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: filter 0.2s; }
  .avatar canvas {
    width: 128px; height: 128px; image-rendering: pixelated; background: #000;
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  }
  .avatar.dim { filter: brightness(0.5) grayscale(0.4); }
  .plate {
    font-weight: 600; font-size: 13px; background: var(--navy); color: #fff; padding: 1px 8px;
    max-width: 136px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .speaker { font-weight: 600; color: var(--navy); min-height: 1.2em; }
  .dtext { position: relative; min-height: 84px; padding: 10px 28px 10px 12px; font-size: 18px; line-height: 1.4; cursor: pointer; }
  .more { position: absolute; right: 10px; bottom: 6px; color: var(--navy); animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .opts { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; max-height: 30vh; }
  .opts button { text-align: left; }
  .opts .asked { color: #505050; }
  .opts .action { font-weight: 600; }
  .badge { background: var(--navy); color: #fff; font-size: 11px; padding: 0 4px; margin-left: 6px; }
  .locked { color: #505050; font-size: 13px; padding: 2px 2px; }
  .pwrow { display: flex; gap: 6px; }
  .pwrow input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 3px 6px; background: #fff;
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  }

  /* quiz window */
  .quiz {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(660px, calc(100% - 16px)); max-height: calc(100% - 16px); display: flex; flex-direction: column;
  }
  .quiz[hidden] { display: none; }
  .qbody { padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .qnum { font-weight: 600; color: var(--navy); }
  .qtext { padding: 10px 12px; font-size: 18px; line-height: 1.4; }
  .qtext p { margin: 0 0 8px; }
  .qtext p:last-child { margin: 0; }
  .qtext .pw { font-weight: 600; color: var(--navy); font-size: 22px; }
  .quiz .opts { max-height: none; }
  @media (max-width: 700px) {
    .hint { display: none; }
    .avatar { width: 68px; }
    .avatar canvas { width: 64px; height: 64px; }
    .plate { font-size: 11px; max-width: 68px; }
    .dtext { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app" class="win">
  <div class="titlebar" id="appTitle"><span>NodeWorld</span><span class="tbtns"><button class="w95 tbtn" id="btnMax" title="Maximize (full screen)" aria-label="Maximize">□</button><button class="w95 tbtn" tabindex="-1" aria-hidden="true">×</button></span></div>
  <div class="toolbar">
    <button class="w95" id="btnPause">Pause</button>
    <button class="w95" id="btnStep" disabled>Step</button>
    <label>Speed
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </label>
    <button class="w95" id="btnLayout">Reset layout</button>
    <button class="w95" id="btnSound">Sound: on</button>
    <span class="hint">Arrows / WASD: drive · E: terminal / door / cable · Shift: boost · Space: next line · 1–4: choose · click: drive there · drag: move a machine</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="dlg" class="win dlg" hidden>
      <div class="titlebar"><span id="dlgTitle"></span><button class="w95 tbtn" id="dlgClose" aria-label="Close">×</button></div>
      <div class="drow">
        <div class="avatar" id="avRbox"><canvas id="avR" width="64" height="64"></canvas><div class="plate">ROBOT</div></div>
        <div class="dmain">
          <div class="speaker" id="dlgSpeaker"></div>
          <div class="dtext sunken" id="dlgText" title="Click or press Space to go on"><span id="dlgLine"></span><span class="more" id="dlgMore">▼</span></div>
          <div class="opts" id="dlgOpts"></div>
        </div>
        <div class="avatar" id="avPbox"><canvas id="avP" width="64" height="64"></canvas><div class="plate" id="dlgName"></div></div>
      </div>
    </div>
    <div id="quiz" class="win quiz" hidden>
      <div class="titlebar"><span id="quizTitle"></span><button class="w95 tbtn" id="quizClose" aria-label="Close">×</button></div>
      <div class="qbody">
        <div class="qnum" id="quizNum"></div>
        <div class="qtext sunken" id="quizText"></div>
        <div class="opts" id="quizOpts"></div>
      </div>
    </div>
  </div>
  <div class="statusbar"><span id="st1"></span><span id="st2"></span></div>
</div>

<script>
// =====================================================================
// DIALOGUE DATA — edit freely.
// greet: plays by itself the first time the robot connects to this kind
//        of machine. Everything else is a question the player chooses.
// twin:  plays on the first visit to the same machine on the other board.
// topics: questions. `after` = a question of this machine that must be
//        asked first. `requires` = machines the robot must have met, or
//        events it must have seen ('sawHandshake', 'sawFin').
// Lines: ['R', text] = robot, ['P', text] = the machine.
// =====================================================================
const DIALOGUE = {
  window: {
    greet: [
      ['R', 'Hello. You are very bright.'],
      ['P', 'I am the Window. I am the only part the human can see.'],
    ],
    twin: [['P', 'You met my twin on the other board. We are the same program. Only the human in front of us is different.']],
    topics: [
      { id: 'human', ask: 'What is a human?', lines: [
        ['P', 'Someone who types. I show them what arrives, and I take what they type.'] ] },
      { id: 'send', ask: 'Do you do the sending too?', after: 'human', lines: [
        ['P', 'No. I give it to the handler. I only look and listen.'],
        ['R', '…That sounds lonely. And important.'] ] },
      { id: 'thread', ask: 'Why can only you paint on yourself?', after: 'send', lines: [
        ['P', 'Only one thread may change me: the UI thread. If two hands paint at once, the picture tears.'],
        ['P', 'When news comes from the network, the handler does not touch me. It posts the news to my thread, and I paint it when I am ready.'] ] },
      { id: 'address', ask: 'What is the number at the top?', lines: [
        ['P', 'My address. An IP and a port.'],
        ['P', 'The human tells it to a friend some other way. With a voice, or a note.'],
        ['R', 'You cannot tell them yourself?'],
        ['P', 'No. Nobody here knows where anyone is until they are told.'] ] },
      { id: 'tabs', ask: 'Why do you have tabs?', lines: [
        ['P', 'One tab for each conversation. Each tab holds on to its own handler.'],
        ['P', 'If one conversation breaks, the other tabs do not notice.'] ] },
      { id: 'counter', ask: 'What is the number under the text box?', requires: ['codec'], lines: [
        ['P', 'It counts bytes, not letters.'],
        ['R', 'Are they not the same?'],
        ['P', "Not always. An 'a' costs one byte. An 'ø' costs six, after it is dressed in JSON."],
        ['P', 'If the message is too heavy, my Send button goes grey. Nothing is saved, and nothing is sent.'] ] },
    ],
  },
  node: {
    greet: [
      ['R', 'Hello. What are you doing?'],
      ['P', 'Listening.'],
    ],
    twin: [['P', 'My twin listens on the other board, on a different port. Same code. Different number.']],
    topics: [
      { id: 'for', ask: 'Listening for what?', lines: [
        ['P', 'For a knock on my port.'] ] },
      { id: 'port', ask: 'Which port?', after: 'for', lines: [
        ['P', 'The one the operating system gave me. I asked for port zero, and it gave me a free one.'],
        ['R', 'Port zero is a strange thing to ask for.'],
        ['P', "It means: 'any port that is free'. It is a polite way to ask."] ] },
      { id: 'accept', ask: 'What happens when someone knocks?', after: 'for', lines: [
        ['P', 'I accept them. Accepting makes a new socket, only for that conversation.'],
        ['P', 'I keep listening on my own socket. The new one goes to a new handler.'] ] },
      { id: 'connect', ask: 'Can you knock too?', after: 'for', lines: [
        ['P', 'Yes. When the human types an address, I open a connection to it.'],
        ['P', 'Every node listens, and every node can connect. Nobody here is the server.'] ] },
      { id: 'handshake', ask: 'What were the three small packets?', requires: ['sawHandshake'], lines: [
        ['P', 'SYN, SYN-ACK, ACK. The handshake.'],
        ['P', 'The operating system does it for us. I only hear about the knock when it is finished.'] ] },
      { id: 'newest', ask: 'What if the same friend knocks twice?', requires: ['handler'], lines: [
        ['P', 'The newest connection wins.'],
        ['R', 'Why the newest?'],
        ['P', 'The old one is often already dead. And often only one side knows it.'] ] },
    ],
  },
  handler: {
    greet: [
      ['R', 'Hello. Are you the boss?'],
      ['P', 'No. I take care of one conversation.'],
    ],
    twin: [['P', 'You talked to my twin. We are mirrors: what I send, it receives.']],
    topics: [
      { id: 'one', ask: 'Only one?', lines: [
        ['P', 'Only one. Each conversation has its own handler. If I break, the others do not.'] ] },
      { id: 'wait', ask: 'What do you wait for?', lines: [
        ['P', 'First, a hello. I do not trust a stranger who does not say hello.'],
        ['R', 'And after the hello?'],
        ['P', 'After that, I listen to my socket. Until it goes quiet.'] ] },
      { id: 'states', ask: "What does 'Ready' mean?", after: 'wait', lines: [
        ['P', 'I have three moods: WaitingForHello, Ready and Closed.'],
        ['P', 'Before Ready, I keep what the human sends in a queue. I do not throw it away.'],
        ['P', 'If no hello comes in ten seconds, I close.'] ] },
      { id: 'hello', ask: 'What is in a hello?', after: 'wait', lines: [
        ['P', 'An ID, and a version.'],
        ['R', 'Why the version?'],
        ['P', 'If our versions are different, we do not talk. We say so clearly, and we close.'] ] },
      { id: 'log', ask: 'Why do you send little papers to the LogWriter?', lines: [
        ['P', 'So that somebody remembers what happened, even if nobody is looking now.'],
        ['P', 'When the hello arrives, and when we close. Not every message. The store keeps those.'] ] },
      { id: 'save', ask: 'Why do you visit the store before you send?', requires: ['store'], lines: [
        ['P', 'I save the message first.'],
        ['P', "If the sending goes wrong, the human still has it. Marked 'not sent'."] ] },
      { id: 'quiet', ask: 'How do you know when the other side is gone?', requires: ['sawFin'], lines: [
        ['P', 'If they leave politely, their system sends FIN. My read gives me zero bytes. That is the end.'],
        ['P', 'If they vanish without a word, the operating system knocks on the wire for me.'],
        ['P', 'After 60 quiet seconds. Then every 10 seconds. After 3 knocks with no answer, my read fails, and I end.'] ] },
    ],
  },
  codec: {
    greet: [
      ['R', 'Hello. What are you doing?'],
      ['P', 'I am counting.'],
    ],
    twin: [['P', 'My twin counts on the other board. We must count the same way, or we would not understand each other.']],
    topics: [
      { id: 'what', ask: 'Counting what?', lines: [
        ['P', 'Bytes. Before every message, I say how many will come.'] ] },
      { id: 'why', ask: 'Why do you count them?', after: 'what', lines: [
        ['P', 'Because the wire forgets where one message stops and the next one begins.'],
        ['R', '…That is a strange wire.'] ] },
      { id: 'prefix', ask: 'How do you say how many?', after: 'what', lines: [
        ['P', 'With four bytes, before the message. Big end first.'],
        ['P', 'Then I read exactly that many bytes. The byte after them is the start of the next count.'] ] },
      { id: 'pause', ask: 'Can you not wait for a pause instead?', after: 'why', lines: [
        ['P', 'There are no pauses in the wire. It keeps the order of the bytes, but not their timing.'],
        ['P', 'Two messages can arrive glued together. One message can arrive in pieces. Only counting is safe.'] ] },
      { id: 'json', ask: 'What is inside the message?', after: 'what', lines: [
        ['P', "JSON. A type comes first: 'hello' or 'chat'. Then the rest."],
        ['P', 'The type tells me which kind of message to build.'] ] },
      { id: 'limit', ask: 'Is there a message that is too big for you?', after: 'prefix', lines: [
        ['P', 'Yes. Anything over 64 kilobytes.'],
        ['R', 'What do you do?'],
        ['P', "I check the count before I make room. If someone says 'three gigabytes are coming', I do not believe them."],
        ['P', 'I complain, and the handler closes the connection.'] ] },
      { id: 'own', ask: 'Do you own the wire?', requires: ['handler'], lines: [
        ['P', 'No. I own nothing. Give me any stream of bytes, and I will count it.'],
        ['P', 'That is why I am easy to test.'] ] },
    ],
  },
  store: {
    greet: [
      ['R', 'Hello. What are you holding?'],
      ['P', 'Every message. One line for each.'],
    ],
    twin: [['P', 'My twin keeps the same conversation in its own file, on the other computer. Two copies, written by two hands.']],
    topics: [
      { id: 'line', ask: 'Why one line for each?', lines: [
        ['P', 'So I can add a new one at the end without reading the old ones.'] ] },
      { id: 'forget', ask: 'Do you ever forget?', lines: [
        ['P', 'Only if the disk forgets.'] ] },
      { id: 'file', ask: 'Where do you keep them?', after: 'line', lines: [
        ['P', "One file for each friend. Its name is the friend's ID, and it ends in .jsonl."],
        ['P', 'JSON Lines. Each line is a full JSON message on its own.'] ] },
      { id: 'id', ask: 'Why the ID, and not the address?', after: 'file', lines: [
        ['P', 'Addresses change. A friend on another port is still the same friend.'],
        ['P', 'The ID stays.'] ] },
      { id: 'when', ask: 'When do you save?', lines: [
        ['P', 'When the human presses Send, before the message leaves.'],
        ['P', 'And when a message arrives, right after.'] ] },
      { id: 'notsent', ask: 'What if a message never arrives?', requires: ['handler'], lines: [
        ['P', "Then I add a mark: 'not sent'."],
        ['P', 'I do not send it again on my own. The wire already tried its best.'] ] },
    ],
  },
  log: {
    greet: [
      ['R', 'Hello. What are you writing?'],
      ['P', 'What happened.'],
    ],
    twin: [['P', 'My twin writes the story of the other board. Two diaries of the same talk.']],
    topics: [
      { id: 'whom', ask: 'For whom?', lines: [
        ['P', 'For nobody, yet. Maybe for someone who comes later and asks why.'],
        ['R', 'Like me?'],
        ['P', 'Like you.'] ] },
      { id: 'queue', ask: 'Why do the papers wait in a line?', lines: [
        ['P', 'Many parts want to write at the same time. Only I write to the files.'],
        ['P', 'They drop their lines in my queue and go back to work. I write them one at a time, so no two lines get mixed.'] ] },
      { id: 'files', ask: 'Which files do you write?', after: 'whom', lines: [
        ['P', 'One folder for each day, by UTC time.'],
        ['P', 'In it: one file for the node, and one for each conversation.'] ] },
      { id: 'utc', ask: 'Why UTC?', after: 'files', lines: [
        ['P', 'Clocks in different places disagree. On some nights, clocks even go back one hour.'],
        ['P', 'UTC never does.'] ] },
      { id: 'inside', ask: 'What is inside you?', lines: [
        ['P', 'Machines. Come in and look. My door is in my bottom wall. Ask me, and I will open it.'] ] },
      { id: 'fail', ask: 'What if you cannot write?', lines: [
        ['P', 'Then I say so once, and the node goes on without me.'],
        ['P', 'A chat without a diary is still a chat.'] ] },
    ],
  },
};

// Live answers to "What are you doing right now?"
const NOW = {
  window: n => N[n].typing ? ['The human is typing. I am holding the letters until they press Send.']
    : N[n].tab ? [`I show the tab for ${N[n].tab}. It has ${N[n].chat.length} lines in it.`]
    : ['I show our address, and I wait for the human.'],
  node: n => !N[n].listening ? ['I am waking up.']
    : handshake ? ['Someone is knocking! The operating system is answering for me.']
    : [`I am listening on port ${INFO[n].port}. Nobody new has knocked.`],
  handler: n => !N[n].handlerAlive ? ['I do not exist right now. There is no conversation, so there is no me.', 'You are talking to the idea of me.']
    : N[n].handlerState === 'Ready' ? ['I am Ready. I am waiting for bytes from my socket.']
    : [`I am ${N[n].handlerState}.`],
  codec: n => N[n].lastFrame ? [`The last message I counted was ${N[n].lastFrame} bytes. I said so in four bytes: ${hex4(N[n].lastFrame)}.`]
    : ['Nothing yet. I am a rule, waiting for bytes.'],
  store: n => [`I hold ${N[n].storeLines} lines in my file.`],
  log: n => [`I have written ${N[n].logLines} lines today.`],
};
// Game-only line (not real Chatap behaviour): said while a board is on alert.
const ALERT_LINE = 'Something keeps stopping our signals. The defenders are awake.';

// Dialogue of the machines inside the LogWriter (same rules as DIALOGUE).
// `lines` can be a function of the node, for answers that read live state.
const ST_DIALOGUE = {
  slots: {
    greet: [['R', 'Hello. What are you?'], ['P', 'Two mouths in the wall. Papers fall into me.']],
    twin: [['P', 'The other LogWriter has slots like mine. Its papers come from the other node.']],
    topics: [
      { id: 'who', ask: 'Who drops the papers?', lines: [
        ['P', 'The Node, through my top mouth. The handlers, through the bottom one.'],
        ['P', 'They drop a paper and run back to work. Nobody outside waits for the writing.'] ] },
      { id: 'why', ask: 'Why do they not wait?', after: 'who', lines: [
        ['P', 'Writing to a disk is slow. A conversation must not stop because a diary is slow.'] ] },
      { id: 'full', ask: 'Are you ever too full to take a paper?', lines: [
        ['P', 'No. I always say yes. The belt behind me has no end.'],
        ['P', 'Only after the gate closes, I say no.'] ] },
    ],
  },
  gate: {
    greet: [['R', 'Hello. Are you a door?'], ['P', 'I am a gate. I am open now.']],
    twin: [['P', 'Every LogWriter has a gate like me.']],
    topics: [
      { id: 'when', ask: 'When do you close?', lines: [
        ['P', 'At closing time, when the program stops.'] ] },
      { id: 'after', ask: 'What happens to the papers inside?', after: 'when', lines: [
        ['P', 'Nothing is lost. Every paper already inside is still written. Then the lights go out.'],
        ['P', 'New papers bounce off me.'] ] },
    ],
  },
  clock: {
    greet: [['R', 'Hello. You go ka-chunk.'], ['P', 'I stamp the time on every paper.']],
    twin: [['P', 'My twin stamps papers in the other node. We both use the same kind of time.']],
    topics: [
      { id: 'when', ask: 'When do you stamp it?', lines: [
        ['P', 'The moment it falls in. The moment it happened, not the moment it gets written.'] ] },
      { id: 'why', ask: 'Why not stamp it later?', after: 'when', lines: [
        ['P', 'The belt can be slow. If I stamped later, the time would lie.'] ] },
      { id: 'utc', ask: 'What kind of time?', lines: [
        ['P', 'UTC. Every clock in the world agrees on it. No summer time, no jumps.'] ] },
    ],
  },
  belt: {
    greet: [['R', 'Hello. You are moving.'], ['P', 'I carry papers that wait.']],
    twin: [['P', 'The other belt carries the other node\'s papers.']],
    topics: [
      { id: 'order', ask: 'In which order?', lines: [
        ['P', 'First in, first out. Nobody jumps the line.'] ] },
      { id: 'end', ask: 'Do you ever get full?', lines: [

function resetLayout() {

function termRect(p) {
  const { side, at } = p.term;
  if (side === 'right')  return { x: p.x + p.w + 6, y: p.y + at * p.h - TH / 2, w: TW, h: TH };
  if (side === 'left')   return { x: p.x - TW - 6, y: p.y + at * p.h - TH / 2, w: TW, h: TH };
  if (side === 'top')    return { x: p.x + at * p.w - TW / 2, y: p.y - TH - 6, w: TW, h: TH };
  return { x: p.x + at * p.w - TW / 2, y: p.y + p.h + 6, w: TW, h: TH };
}
// Where the robot parks to use a terminal (outside it, away from the machine).
function termSpot(p) {
  const t = termRect(p), side = p.term.side;
  if (side === 'right')  return { x: t.x + t.w + 36, y: t.y + t.h - 8 };
  if (side === 'left')   return { x: t.x - 36, y: t.y + t.h - 8 };
  if (side === 'top')    return { x: t.x + t.w / 2 + 50, y: t.y + t.h - 8 };
  return { x: t.x + t.w / 2, y: t.y + t.h + 36 };

// The password board in the top-left corner of Node A. Passwords appear as they are earned.

// Walkable floor of a board, and the dock where the TCP cable plugs in.
function floor(n) { const b = BOARD[n]; return { x: b.x + 14, y: b.y + TITLE + 8, w: BW - 28, h: BH - TITLE - 16 }; }

// Geometry helpers for the cable (a sagging curve between the docks).
function center(p) { return { x: p.x + p.w / 2, y: p.y + p.h / 2 }; }
function bridgePts(from) {

  for (let i = 0; i <= 48; i++) {
    const t = i / 48, u = 1 - t;
    pts.push({
      x: u * u * u * a.x + 3 * u * u * t * a.x + 3 * u * t * t * b.x + t * t * t * b.x,
      y: u * u * u * a.y + 3 * u * u * t * (a.y + 900) + 3 * u * t * t * (b.y + 900) + t * t * t * b.y,

}

}

  return [center(a), center(b)];

// Which space the robot is in: the world, or inside a room (scene.room = machine type) of one node.
let scene = { kind: 'world' };

// Simulation state

function resetRun() {

// =====================================================================
// SCHEDULER — scenario steps are generators that yield wait conditions.
// =====================================================================
let tasks = [];
function isReady(c) {

  if (c.packet) return c.packet.done;
  if (c.tasks) return c.tasks.every(t => t.done);
  return true;
}
function runTask(t) {

    if (t.wait) { if (!isReady(t.wait)) return; t.wait = null; }
    const r = t.gen.next();
    if (r.done) { t.done = true; return; }
    t.wait = r.value || null;
  }
}
function spawn(gen) { const t = { gen, wait: null, done: false }; tasks.push(t); runTask(t); return t; }
const wait = ms => ({ until: simTime + ms });
function all(...items) {
  return { tasks: items.map(it => spawn(typeof it.next === 'function' ? it : (function* () { yield it; })())) };
}

// Packets travel through a list of part ids. `at[i]` runs when it reaches path[i].
function send(path, kind, opts = {}) {
  const p = { path, kind, label: opts.label || '', at: opts.at || {}, i: 0, t: 0, holdUntil: 0, done: false, blocked: false };
  packets.push(p);
  return { packet: p };
}

  if (s.fn) s.fn();
}

    if (simTime < p.holdUntil) continue;
    let move = SPEED * dt;
    while (move > 0 && p.i < last) {
      const pts = segPts(p.path[p.i], p.path[p.i + 1]);
      const len = Math.max(1, polyLen(pts));
      const remain = (1 - p.t) * len;
      // The robot standing on the wire stops the signal in front of it.
      if (robotBlocks(pointAt(pts, p.t * len + Math.min(move, remain)))) {
        // Game rule: a stuck signal bumps into the robot again every 1.5 s, and every bump counts.
        if (!p.blocked || simTime >= p.nextBump) { p.blocked = true; p.nextBump = simTime + 1500; onBlocked(p); }
        break;
      }
      p.blocked = false;
      if (move < remain) { p.t += move / len; move = 0; }

// A float is a short note above a part id, or at a world point {x, y}.

// =====================================================================
// SCENARIO — the two nodes' example life, in a loop.
// =====================================================================
function other(n) { return n === 'A' ? 'B' : 'A'; }

const enc = new TextEncoder();
function jsonBytes(obj) {

  const json = JSON.stringify(obj).replace(/[\u0080-￿]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
  return enc.encode(json).length;
}
const START = Date.UTC(2026, 9, 19, 12, 0, 0);
const simDate = () => new Date(START + simTime);
const utcStamp = () => simDate().toISOString().replace(/\.\d+Z$/, 'Z');
const sentStamp = () => simDate().toISOString().replace(/\.\d+Z$/, '.0000000+00:00');

// A real Chatap log line. The time is taken now, when it happens (like LogWriter.Log).
// peer = true: the line goes to the conversation file, else to node.txt.
function* logLine(n, from, text, peer = false) {
  const line = `${utcStamp()}  ${text}`;
  yield send([`${n}.${from}`, `${n}.log`], 'log', { at: { 1: { fn: () => { N[n].logLines++; intake(n, from === 'node' ? 'node' : 'handler', peer, line); } } } });
}
function* typeInto(n, text) {
  N[n].typing = '';
  for (const c of text) { N[n].typing += c; yield wait(65); }
  yield wait(350);
}
function* hello(x) {
  const y = other(x);
  const len = jsonBytes({ type: 'hello', id: INFO[x].id, version: 1 });
  yield send([`${x}.handler`, `${x}.codec`, `${y}.codec`, `${y}.handler`], 'hello', { at: {
    1: { say: `frame: ${hex4(len)} + ${len} B`, fn: () => { N[x].lastFrame = len; } },
    2: { say: `read 4 B, then ${len} B`, fn: () => { N[y].lastFrame = len; } },
    3: { say: 'hello v1 ✓ → Ready', fn: () => { N[y].handlerState = 'Ready'; spawn(logLine(y, 'handler', `hello from ${endpoint(x)}: ready`, true)); } },
  } });
}
function* ready(n) {
  yield send([`${n}.handler`, `${n}.window`], 'cmd', { label: 'Ready', at: {
    1: { say: 'tab opens (UI thread)', fn: () => { N[n].tab = `Node ${other(n)}`; winReady(n); } },
  } });
}
// Chat messages are saved by the store; the handler does not log them.
function* chat(x, text) {
  const y = other(x);
  yield* typeInto(x, text);
  N[x].typing = '';
  N[x].chat.push({ from: x, text });
  winSend(x, text);
  const len = jsonBytes({ type: 'chat', text, sent: sentStamp() });
  yield send([`${x}.window`, `${x}.handler`, `${x}.store`, `${x}.handler`, `${x}.codec`, `${y}.codec`, `${y}.handler`, `${y}.store`, `${y}.handler`, `${y}.window`], 'chat', { at: {
    1: { say: 'SendAsync' },
    2: { say: 'saved before send', fn: () => N[x].storeLines++ },
    4: { say: `prefix ${hex4(len)} → ${len} B`, fn: () => { N[x].lastFrame = len; } },
    5: { say: `read 4 B, then ${len} B`, fn: () => { N[y].lastFrame = len; } },
    6: { say: 'MessageReceived' },
    7: { say: 'saved', fn: () => N[y].storeLines++ },

function* scenario() {
  for (;;) {
    resetRun();
    yield wait(600);

      // The nodes start once; later loops are new conversations, not restarts.
      for (const n of ['A', 'B']) { N[n].listening = true; floatAt(`${n}.node`, `port 0 → OS gives :${INFO[n].port}`); }
      yield all(logLine('A', 'node', `listening on port ${INFO.A.port}`), logLine('B', 'node', `listening on port ${INFO.B.port}`));
    }
    yield wait(1200);

    // Human A types B's address and presses Connect.
    yield* typeInto('A', `${INFO.B.ip}:${INFO.B.port}`);
    floatAt('A.window', 'Connect');
    winConnect('A');
    yield send(['A.window', 'A.node'], 'cmd', { label: 'connect' });
    N.A.typing = '';
    spawn(logLine('A', 'node', `outgoing connection to ${INFO.B.ip}:${INFO.B.port}`));

    // TCP three-way handshake (done by the operating systems), over the cable.
    handshake = true;
    events.add('sawHandshake');
    yield send(['A.node', 'A.codec', 'B.codec', 'B.node'], 'syn', { label: 'SYN' });
    yield send(['B.node', 'B.codec', 'A.codec', 'A.node'], 'syn', { label: 'SYN-ACK' });
    yield send(['A.node', 'A.codec', 'B.codec', 'B.node'], 'syn', { label: 'ACK' });
    handshake = false;
    tcp = 'up';
    floatAt('B.node', 'accept() → new socket');
    floatAt('A.node', 'connected');
    for (const n of ['A', 'B']) { N[n].handlerAlive = true; N[n].handlerState = 'WaitingForHello'; }
    winTabOpen('A');   // an outgoing conversation shows its tab at once
    yield all(
      send(['A.node', 'A.handler'], 'cmd', { label: 'socket' }),
      send(['B.node', 'B.handler'], 'cmd', { label: 'socket' }),
      logLine('B', 'node', `incoming connection from ${endpoint('A')}`));

    // Both sides say hello first.
    yield all(hello('A'), hello('B'));
    yield all(ready('A'), ready('B'));
    yield wait(800);

    for (const [from, text] of CONVO) { yield* chat(from, text); yield wait(700); }
    yield wait(1500);

    // A closes the conversation. FIN goes one way, then the other.
    floatAt('A.window', 'close conversation');
    yield send(['A.window', 'A.handler'], 'cmd', { label: 'close' });
    N.A.handlerState = 'Closed'; N.A.tab = null; winEnd('A');
    spawn(logLine('A', 'handler', 'closed: LocalClose (closed by this node)', true));
    yield send(['A.handler', 'A.codec', 'B.codec', 'B.handler'], 'fin', { label: 'FIN', at: {
      2: { say: 'read → 0 bytes → end' },
      3: { say: 'EOF → Disconnected', fn: () => {
        N.B.handlerState = 'Closed'; events.add('sawFin');
        spawn(logLine('B', 'handler', 'closed: PeerClosed (the peer closed the connection)', true));
      } },
    } });
    yield send(['B.handler', 'B.window'], 'cmd', { label: 'Disconnected', at: {
      1: { fn: () => { N.B.chat.push({ from: 'sys', text: 'Node A left.' }); winEnd('B'); } },
    } });
    yield send(['B.handler', 'B.codec', 'A.codec', 'A.handler'], 'fin', { label: 'FIN', at: {
      3: { say: 'other direction closed' },
    } });
    tcp = 'none';
    for (const n of ['A', 'B']) N[n].handlerAlive = false;
    yield wait(1600);
    N.B.tab = null;
    yield wait(3000);
  }
}

}

addEventListener('keydown', e => {

// Mouse / touch: drag machines; click to drive, talk, hop or enter.
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

}

cv.addEventListener('pointerdown', e => {

// DOOR FADES, PACKAGE VIEW AND THE GUARD
// =====================================================================
// fade: the screen goes black (a: 0 → 1), `then` runs, and it comes back (a: 1 → 0).
let fade = null;
function fadeTo(then, outTime, inTime, slide) {
  fade = { a: 0, dir: 1, out: outTime, in: inTime, then, slide };
  robot.target = null; keys.clear();
}
function updateFade(dt) {
  if (!fade) return;
  if (fade.dir > 0) {
    if (fade.slide) { robot.x += fade.slide.x * dt; robot.y += fade.slide.y * dt; robot.moving = true; robot.phase += dt * 8; }
    fade.a = Math.min(1, fade.a + dt / fade.out);
    if (fade.a >= 1) { fade.then(); fade.dir = -1; fade.slide = null; robot.moving = false; }
  } else {
    fade.a -= dt / fade.in;
    if (fade.a <= 0) fade = null;
  }
}
// The robot cannot be driven during a fade, a ride, or while the guard holds it.
function locked() { return !!fade || !!pkgRide || (!!guard && guard.state !== 'leave'); }

// Package view: the camera becomes a package and rides one route through the room.
let pkgRide = null;
const RIDE_SPEED = 300;
function startRide(ride) {
  const pts = ride.stops;
  pkgRide = { ride, pts, len: polyLen(pts), d: 0, next: 0, dwell: 0, caption: '' };
  robot.target = null; keys.clear();
  sfxModem();
}
function rideText(stop) { return typeof stop.say === 'function' ? stop.say() : stop.say; }
function ridePos() { return pointAt(pkgRide.pts, pkgRide.d); }
// Distance along the route to stop i.
function stopDist(pts, i) { return polyLen(pts.slice(0, i + 1)); }
function updateRide(dt) {
  const r = pkgRide;
  if (!r) return;
  if (r.dwell > 0) { r.dwell -= dt; return; }
  while (r.next < r.pts.length && stopDist(r.pts, r.next) <= r.d + 0.01) {
    const st = r.pts[r.next++];
    if (st.say) { r.caption = rideText(st); r.dwell = Math.max(2.4, r.caption.length * 0.05); sfxClick(); return; }
  }
  if (r.d >= r.len) { pkgRide = null; startGuard(); return; }
  r.d = Math.min(r.len, r.d + RIDE_SPEED * dt);
}
function rideSkip() { if (pkgRide && pkgRide.dwell > 0) pkgRide.dwell = 0; }

// The guard: an antibody that does not like extra packages on the belts (game rule, not Chatap).
let guard = null;
const rideStrikes = {};   // "room.node" → rides since the robot was last thrown out
const GUARD_SPEED = 520;
function startGuard() {
  const key = `${scene.room}.${scene.node}`, strike = rideStrikes[key] = (rideStrikes[key] || 0) + 1;
  const ex = roomOf().exit;
  guard = { x: ex.x + ex.w / 2, y: ex.y - 30, state: 'come', t: 0, strike, key, wob: 0, say: '' };
  sfxAlarm();
}
function moveToward(o, tx, ty, step) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d <= step) { o.x = tx; o.y = ty; return true; }
  o.x += dx / d * step; o.y += dy / d * step; return false;
}
function updateGuard(dt) {
  const g = guard;
  if (!g) return;
  g.t += dt; g.wob += dt * 9;
  const ex = roomOf().exit;
  if (g.state === 'come') {
    if (moveToward(g, robot.x - 80, robot.y - 50, GUARD_SPEED * dt)) {
      g.state = 'talk'; g.t = 0;
      g.say = g.strike === 1
        ? 'WARNING. Foreign package on the belt. Do not add packages to the belt again, or you will be removed from the factory.'
        : 'Second foreign package. You are removed from the factory.';
    }
  } else if (g.state === 'talk') {
    if (g.t > (g.strike === 1 ? 5 : 2.5)) {
      if (g.strike === 1) { g.state = 'leave'; g.say = ''; }
      else {
        g.state = 'push'; g.t = 0; g.say = '';
        g.route = [{ x: ex.x + ex.w / 2, y: robot.y }, { x: ex.x + ex.w / 2, y: ex.y - 20 }];
        think('Hey! I was only looking!');
      }
    }
  } else if (g.state === 'push') {
    // Push the robot along the wall to the exit, then out.
    const to = g.route[0];
    if (moveToward(robot, to.x, to.y, 260 * dt)) g.route.shift();
    robot.moving = true; robot.phase += dt * 10;
    g.x = robot.x + (robot.x > ex.x + ex.w / 2 ? 60 : 0); g.y = robot.y - 70;
    if (!g.route.length || g.t > 6) {

  }
}
function drawAntibody(x, y, k, wob) {
  ctx.fillStyle = C.dk; ctx.beginPath(); ctx.arc(x, y, 26 * k, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe000'; ctx.beginPath(); ctx.arc(x, y, 22 * k, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d00000'; ctx.fillRect(x - 5 * k, y - 15 * k, 10 * k, 19 * k); ctx.fillRect(x - 5 * k, y + 8 * k, 10 * k, 8 * k);

}

  drawAntibody(g.x, g.y, AB * 1.6, g.wob);

}
// The package itself, and the dark edges of the package view.
function drawRidePackage() {

  ctx.fillStyle = 'rgba(255,240,120,0.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, 34 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.dk; ctx.fillRect(p.x - 17, p.y - 13, 34, 26);
  ctx.fillStyle = '#fff4c0'; ctx.fillRect(p.x - 15, p.y - 11, 30, 22);
  ctx.strokeStyle = C.lo; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x - 15, p.y - 11); ctx.lineTo(p.x, p.y + 1); ctx.lineTo(p.x + 15, p.y - 11); ctx.stroke();
}
function drawRideOverlay() {
  if (!pkgRide) return;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const cw = view.cw, ch = view.ch;
  const g = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.25, cw / 2, ch / 2, Math.max(cw, ch) * 0.7);

  font(15, false); ctx.fillStyle = '#000'; ctx.textAlign = 'left';
  lines.forEach((l, i) => ctx.fillText(l, x + 14, y + 44 + i * 20));

function drawFade() {
  if (!fade) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = `rgba(0,0,0,${Math.min(1, fade.a)})`; ctx.fillRect(0, 0, cv.width, cv.height);
}
function drawPortStation(s) {

  bevel(s.x + 14, s.y + 36, s.w - 28, s.h - 48, false, '#101820', 2);
  const k = (performance.now() / 600) % 1;

// =====================================================================
// DIALOGUE
// =====================================================================
const dlgEl = document.getElementById('dlg'), dlgOpts = document.getElementById('dlgOpts');
const dlgLine = document.getElementById('dlgLine'), dlgMore = document.getElementById('dlgMore'), dlgSpeaker = document.getElementById('dlgSpeaker');
const know = { met: new Set(), metInst: new Set(), asked: new Set(), seen: {}, stations: new Set() };
// dlg.part = what the robot is connected to: a machine in the world, or a station inside a room.
const dlg = { part: null, queue: [], cur: null, optionsShown: false, delay: 0, after: null };
const doorOpen = {}, doorAnim = {};   // by part id; doors start closed
const TOTAL_TOPICS = [...Object.values(DIALOGUE), ...Object.values(ROOMS).flatMap(r => Object.values(r.dialogue))].reduce((s, d) => s + d.topics.length, 0);

function dialogueOf(t) { return t.kind !== 'station' ? DIALOGUE[t.type] : t.st.id === 'port' ? PORT_DIALOGUE : ROOMS[t.room].dialogue[t.st.id]; }
function nowLines(t) { return t.kind !== 'station' ? NOW[t.type](t.node) : t.st.id === 'port' ? ['Waiting for a passenger.'] : ROOMS[t.room].now[t.st.id](t.node); }
function linesOf(topic, t) { return typeof topic.lines === 'function' ? topic.lines(t.node) : topic.lines; }
function available(t) {

    (!tp.requires || tp.requires.every(r => know.met.has(r) || events.has(r))) &&
    (!tp.after || know.asked.has(`${t.type}.${tp.after}`)));
}
function partLabel(p) { return `${p.name} (Node ${p.node})`; }
function shownName(p) { return know.metInst.has(p.id) ? p.name : '???'; }

function openDialog(p) {
  if (dlg.part || robot.ride || robot.pushed) return;
  dlg.part = p; dlg.queue = []; dlg.cur = null; dlg.delay = 1.1;   // the modem connects first
  robot.target = null; keys.clear();
  dlgOpts.innerHTML = ''; dlgLine.textContent = ''; dlgSpeaker.textContent = '';
  document.getElementById('dlgTitle').textContent = `Terminal link — ${p.name}, Node ${p.node}`;
  document.getElementById('dlgName').textContent = p.name;
  dlgEl.hidden = false;
  sfxModem();
  if (p.kind === 'station') know.stations.add(p.type);
  const d = dialogueOf(p);
  const seen = know.seen[p.id] || (know.seen[p.id] = new Set());
  if (!know.met.has(p.type)) {
    say(d.greet);
    know.met.add(p.type); know.metInst.add(p.id);
  } else if (!know.metInst.has(p.id)) {
    say([['R', 'Hello. Have we met?'], ...d.twin]);
    know.metInst.add(p.id);
  } else {
    const fresh = available(p).some(t => !seen.has(t.id) && !know.asked.has(`${p.type}.${t.id}`));
    say([['P', fresh ? 'Oh. You came back. I have thought of something new.' : 'Oh. You came back.']]);
  }
  if (p.kind !== 'station' && alert(p.node)) say([['P', ALERT_LINE]]);
  dlg.optionsShown = false;
}
function closeDialog() {
  if (dlg.part) sfxHangup();
  dlg.part = null; dlg.queue = []; dlg.cur = null; dlg.optionsShown = false; dlg.after = null;
  dlgEl.hidden = true;
}
function say(lines) { dlg.queue.push(...lines); }
// Space or click: show the whole line at once, or go to the next line.
function skipLine() {
  const c = dlg.cur; if (!c) return;
  if (c.shown < c.text.length) c.shown = c.text.length;
  else c.hold = 0;
}
function showOptions() {
  const p = dlg.part, type = p.type;
  const seen = know.seen[p.id];
  const firstLook = seen.size === 0;
  dlgOpts.innerHTML = '';
  const avail = available(p);
  const make = (label, fn, cls, badge) => {
    const b = document.createElement('button');
    b.className = 'w95' + (cls ? ' ' + cls : '');
    b.textContent = `${dlgOpts.querySelectorAll('button').length + 1}. ${label}`;
    if (badge) { const s = document.createElement('span'); s.className = 'badge'; s.textContent = badge; b.append(s); }
    b.onclick = fn;
    dlgOpts.append(b);
  };
  const ask = (lines) => { say(lines); dlg.optionsShown = false; dlgOpts.innerHTML = ''; };
  // Questions not asked yet first, then the ones already asked.
  const order = [...avail.filter(t => !know.asked.has(`${type}.${t.id}`)), ...avail.filter(t => know.asked.has(`${type}.${t.id}`))];
  for (const t of order) {
    const key = `${type}.${t.id}`, asked = know.asked.has(key);
    const isNew = !asked && !firstLook && !seen.has(t.id);
    make((asked ? '✓ ' : '') + t.ask, () => { know.asked.add(key); ask([['R', t.ask], ...linesOf(t, p)]); }, asked ? 'asked' : '', isNew ? 'new' : '');
  }

    for (const ride of ROOMS[p.room].rides) make(`Ride ${ride.name}`, () => { closeDialog(); startRide(ride); }, 'action');
  }
  if (p.kind !== 'station') {
    // A locked machine asks for its password. An unlocked one has a quiz about itself.
    if (!progress.unlocked.has(p.type)) make('Input the password', () => askPassword(p), 'action');
    else if (QUIZZES[p.type]) make(progress.passed.has(p.type) ? `✓ Take the quiz about the ${p.name} again` : `Take the quiz about the ${p.name} (10 questions)`, () => {
      ask([['R', 'I want to take your quiz.'], ['P', 'Ten questions. You need all ten. I tell you the result at the end.']]);
      dlg.after = () => startQuiz(p);
    }, 'action');
  }
  make('What are you doing right now?', () => ask([['R', 'What are you doing right now?'], ...nowLines(p).map(s => ['P', s])]));
  make('Goodbye. (disconnect)', closeDialog);
  for (const t of avail) seen.add(t.id);
  const locked = dialogueOf(p).topics.length - avail.length;
  if (locked > 0) {
    const s = document.createElement('div'); s.className = 'locked';
    s.textContent = locked === 1 ? 'There is one more thing to ask. Ask more, or learn more elsewhere.' : `There are ${locked} more things to ask. Ask more, or learn more elsewhere.`;
    dlgOpts.append(s);
  }
  dlg.optionsShown = true;
}
document.getElementById('dlgText').addEventListener('click', skipLine);
document.getElementById('dlgClose').onclick = closeDialog;

function updateDialog(dt) {
  if (!dlg.part) return;
  if (dlg.delay > 0) {
    dlg.delay -= dt;
    dlgSpeaker.textContent = '';
    dlgLine.textContent = 'CONNECTING' + '.'.repeat(1 + (Math.floor(performance.now() / 250) % 3));
    dlgMore.style.visibility = 'hidden';
    return;
  }
  if (!dlg.cur && dlg.queue.length) {
    const [who, text] = dlg.queue.shift();
    dlg.cur = { who, text, shown: 0, hold: 3 + text.length * 0.045 };
    dlgSpeaker.textContent = who === 'R' ? 'Robot' : partLabel(dlg.part);
  }
  const c = dlg.cur;
  if (c) {
    if (c.shown < c.text.length) {
      c.shown = Math.min(c.text.length, c.shown + 45 * dt);
      dlgLine.textContent = c.text.slice(0, Math.floor(c.shown));
      dlgMore.style.visibility = 'hidden';
    } else {
      dlgLine.textContent = c.text;
      dlgMore.style.visibility = 'visible';
      c.hold -= dt;
      if (c.hold <= 0) dlg.cur = null;
    }
  } else if (dlg.after) { const f = dlg.after; dlg.after = null; f(); }
  else if (!dlg.optionsShown) { dlgMore.style.visibility = 'hidden'; showOptions(); }
}

// =====================================================================
// QUIZZES AND PASSWORDS
// =====================================================================
const progress = { unlocked: new Set(), passed: new Set(), earned: new Set() };
const quizEl = document.getElementById('quiz'), quizOpts = document.getElementById('quizOpts');
const quizNum = document.getElementById('quizNum'), quizText = document.getElementById('quizText');
const quiz = { part: null, items: [], i: 0, wrong: [], phase: 'off' };   // phase: off, ask, result
function nextOf(type) { const i = ORDER.indexOf(type); return i >= 0 && i < ORDER.length - 1 ? ORDER[i + 1] : null; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Both nodes are copies, so a password opens the door on both boards.
function unlock(type) {
  progress.unlocked.add(type);
  for (const n of ['A', 'B']) doorOpen[`${n}.${type}`] = true;
}

unlock(ORDER[0]);   // the first machine is open from the start

function askPassword(p) {
  dlgOpts.innerHTML = '';
  const row = document.createElement('div'); row.className = 'pwrow';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.placeholder = 'Password';
  const ok = document.createElement('button'); ok.className = 'w95'; ok.textContent = 'OK';
  const back = document.createElement('button'); back.className = 'w95'; back.textContent = 'Back';
  ok.onclick = () => submitPassword(p, inp.value);
  back.onclick = () => { dlgOpts.innerHTML = ''; dlg.optionsShown = false; };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); ok.click(); }
    if (e.key === 'Escape') { e.preventDefault(); back.click(); }
  });
  row.append(inp, ok, back);
  dlgOpts.append(row);
  if (inp.focus) inp.focus();
}
function submitPassword(p, value) {
  const v = value.trim().toLowerCase();
  dlgOpts.innerHTML = ''; dlg.optionsShown = false;
  if (v === MASTER_PASSWORD) {
    unlock(p.type); sfxDoor();
    say([['R', 'adminadmin1'], ['P', 'Oh. The admin password. Right away.'], ['P', 'Opening the door. Mind the step.']]);
  } else if (v === PASSWORDS[p.type]) {
    unlock(p.type); sfxDoor();
    say([['R', 'I have the password.'], ['P', 'Password accepted.'], ['P', 'Opening the door. Mind the step.']]);
  } else {
    sfxWrong();
    say([['R', 'I have the password.'], ['P', 'That is not my password. The door stays closed.']]);
  }
}

function startQuiz(p) {
  quiz.part = p; quiz.i = 0; quiz.wrong = []; quiz.phase = 'ask';
  quiz.items = shuffle(QUIZZES[p.type]).map(q => ({ q: q.q, opts: shuffle(q.a.map((text, k) => ({ text, right: k === 0 }))) }));
  victoryEnd = 0;   // a new quiz stops the victory music
  document.getElementById('quizTitle').textContent = `Quiz — ${p.name}, Node ${p.node}`;
  dlgEl.hidden = true; quizEl.hidden = false;
  showQuestion();
}
function quizButton(label, fn) {
  const b = document.createElement('button');
  b.className = 'w95'; b.textContent = label; b.onclick = fn;
  quizOpts.append(b);
}
function showQuestion() {
  const it = quiz.items[quiz.i];
  quizNum.textContent = `Question ${quiz.i + 1} of ${quiz.items.length}`;
  quizText.textContent = it.q;
  quizOpts.innerHTML = '';
  it.opts.forEach((o, k) => quizButton(`${k + 1}. ${o.text}`, () => answer(o.right)));
}
function answer(right) {
  if (!right) quiz.wrong.push(quiz.i + 1);
  sfxClick();
  quiz.i++;
  if (quiz.i < quiz.items.length) showQuestion(); else showResult();
}
// Only the numbers of the wrong questions are shown, not the right answers.
function listNumbers(a) { return a.length === 1 ? `${a[0]}` : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`; }
function showResult() {
  const p = quiz.part, pass = quiz.wrong.length === 0, next = nextOf(p.type);
  quiz.phase = 'result';
  quizNum.textContent = 'Result';
  quizOpts.innerHTML = '';
  const para = (html) => { const e = document.createElement('p'); e.innerHTML = html; return e; };
  quizText.innerHTML = '';
  if (pass) {
    progress.passed.add(p.type);
    if (next) {
      progress.earned.add(next);
      quizText.append(para('All ten answers are correct. You may enter.'),
        para(`The password for the ${TYPES[next].name}:`), para(`<span class="pw">${PASSWORDS[next]}</span>`),
        para('It is now also on the password board, in the top-left corner of Node A.'));
    } else quizText.append(para('All ten answers are correct. That was the last machine.'));
    startVictory();
    quizButton('1. Close', closeQuiz);
  } else {
    const w = quiz.wrong;
    quizText.append(para(w.length === 1 ? `Your answer was incorrect on question ${w[0]}.` : `Your answers were incorrect on questions ${listNumbers(w)}.`));
    sfxWrong();
    quizButton('1. Try again', () => startQuiz(p));
    quizButton('2. Close', closeQuiz);
  }
}
function closeQuiz() {
  const p = quiz.part, finished = quiz.phase === 'result', pass = progress.passed.has(p.type) && finished && !quiz.wrong.length;
  quiz.phase = 'off'; quizEl.hidden = true;
  if (!dlg.part) return;
  dlgEl.hidden = false; dlgOpts.innerHTML = ''; dlg.optionsShown = false;
  const next = nextOf(p.type);
  if (pass) say([['P', next ? `Well done. Take the password to the ${TYPES[next].name} terminal.` : 'Well done. You know every machine now.']]);
  else say([['P', 'Come back when you are ready. My stations know the answers.']]);
}
document.getElementById('quizClose').onclick = closeQuiz;

// ---------- the two faces in the dialogue box ----------
const avR = document.getElementById('avR').getContext('2d'), avP = document.getElementById('avP').getContext('2d');
function faceBevel(g, x, y, w, h, fill) {
  g.fillStyle = fill; g.fillRect(x, y, w, h);
  g.fillStyle = '#fff'; g.fillRect(x, y, w, 1); g.fillRect(x, y, 1, h);
  g.fillStyle = '#000'; g.fillRect(x, y + h - 1, w, 1); g.fillRect(x + w - 1, y, 1, h);
  g.fillStyle = '#808080'; g.fillRect(x + 1, y + h - 2, w - 2, 1); g.fillRect(x + w - 2, y + 1, 1, h - 2);
}
function drawRobotFace(g, talking, t) {
  g.fillStyle = '#008080'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = 'rgba(0,0,0,0.15)'; for (let y = 0; y < 64; y += 4) g.fillRect(0, y, 64, 1);
  g.fillStyle = '#000'; g.fillRect(31, 5, 2, 10);
  g.fillStyle = (t % 1.4) < 0.7 ? '#ff2020' : '#20c020'; g.fillRect(29, 1, 6, 5);
  faceBevel(g, 8, 15, 48, 40, '#c0c0c0');
  g.fillStyle = '#808080'; g.fillRect(10, 30, 2, 2); g.fillRect(52, 30, 2, 2);   // bolts
  const blink = (t % 3.2) < 0.12;
  g.fillStyle = '#000';
  if (blink) { g.fillRect(18, 28, 9, 2); g.fillRect(37, 28, 9, 2); }
  else { g.fillRect(18, 24, 9, 9); g.fillRect(37, 24, 9, 9); g.fillStyle = '#fff'; g.fillRect(20, 26, 2, 2); g.fillRect(39, 26, 2, 2); }
  for (let i = 0; i < 6; i++) {
    const h = talking ? 2 + Math.round(Math.abs(Math.sin(t * 17 + i * 1.3)) * 6) : 2;
    g.fillStyle = '#202020'; g.fillRect(19 + i * 5, 46 - Math.floor(h / 2), 3, h);
  }
}
function drawTerminalFace(g, target, talking, t) {
  g.fillStyle = '#202020'; g.fillRect(0, 0, 64, 64);
  faceBevel(g, 4, 3, 56, 50, '#c0c0c0');
  g.fillStyle = '#000'; g.fillRect(9, 7, 46, 30);
  const eye = target.kind !== 'station' && alert(target.node) ? '#ff4040' : target.kind === 'station' ? '#40e0ff' : '#40ff80';
  const blink = (t % 4.1) < 0.14, look = Math.round(Math.sin(t * 0.8) * 2);
  g.fillStyle = eye;
  if (blink) { g.fillRect(15, 16, 11, 1); g.fillRect(38, 16, 11, 1); }
  else {
    g.fillRect(15, 12, 11, 8); g.fillRect(38, 12, 11, 8);
    g.fillStyle = '#000'; g.fillRect(19 + look, 14, 3, 4); g.fillRect(42 + look, 14, 3, 4);
  }
  g.fillStyle = eye;
  for (let i = 0; i < 8; i++) {
    const h = talking ? 1 + Math.round(Math.abs(Math.sin(t * 19 + i * 0.9)) * 5) : 1;
    g.fillRect(17 + i * 4, 29 - Math.floor(h / 2), 3, h);
  }
  g.fillStyle = 'rgba(0,0,0,0.35)'; for (let y = 7; y < 37; y += 2) g.fillRect(9, y, 46, 1);   // scanlines
  // name plate on the terminal body
  g.fillStyle = '#e8e0c0'; g.fillRect(9, 40, 46, 10);
  g.fillStyle = '#000'; g.font = `600 7px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const plate = target.plate || target.name.replace('Connection', '').replace('Conversation', '').toUpperCase();
  g.fillText(plate.length > 11 ? plate.slice(0, 10) + '…' : plate, 32, 45.5);
  g.fillStyle = '#808080'; g.fillRect(24, 53, 16, 5); g.fillRect(14, 58, 36, 4);   // stand
}
function drawAvatars(now) {
  if (!dlg.part) return;
  const t = now / 1000, c = dlg.cur;
  const talking = c && c.shown < c.text.length ? c.who : null;
  document.getElementById('avRbox').classList.toggle('dim', !!c && c.who === 'P');
  document.getElementById('avPbox').classList.toggle('dim', !!c && c.who === 'R');
  drawRobotFace(avR, talking === 'R', t);
  drawTerminalFace(avP, dlg.part, talking === 'P', t);
}

// MAP FOG — the mini-map shows only places the robot has been near.
// =====================================================================
const FOG_RES = 10, REVEAL = 380;
function makeFog(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w / FOG_RES); c.height = Math.ceil(h / FOG_RES);
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  return { c, g };
}
const fogs = { world: makeFog(W, H) };   // plus one per room and node, made on the first visit
function currentFog() {
  if (scene.kind === 'world') return fogs.world;
  const k = `${scene.room}.${scene.node}`, r = roomOf();
  return fogs[k] || (fogs[k] = makeFog(r.w, r.h));
}
function reveal() {
  const g = currentFog().g;
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = '#000'; g.beginPath(); g.arc(robot.x / FOG_RES, robot.y / FOG_RES, REVEAL / FOG_RES, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-over';
}

// =====================================================================
// DRAWING
// =====================================================================
const C = { face: '#c0c0c0', light: '#dfdfdf', hi: '#ffffff', lo: '#808080', dk: '#000000', navy: '#000080', title2: '#1084d0', desk: '#008080', tip: '#ffffe1', voidc: '#004d4d' };
const FONT = '"Pixelify Sans", monospace';
function font(size, bold) { ctx.font = `${bold ? 600 : 400} ${size}px ${FONT}`; }
function txt(s, x, y, size = 12, color = '#000', bold = false, align = 'left') {
  font(size, bold); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function fit(s, maxW) {
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
// Windows 95 3D edge; t = edge thickness in world px.
function bevel(x, y, w, h, raised = true, fill = C.face, t = 2) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  const [a, b, c, d] = raised ? [C.hi, C.dk, C.light, C.lo] : [C.lo, C.hi, C.dk, C.light];
  ctx.fillStyle = a; ctx.fillRect(x, y, w, t); ctx.fillRect(x, y, t, h);
  ctx.fillStyle = b; ctx.fillRect(x, y + h - t, w, t); ctx.fillRect(x + w - t, y, t, h);
  ctx.fillStyle = c; ctx.fillRect(x + t, y + t, w - 2 * t, t); ctx.fillRect(x + t, y + t, t, h - 2 * t);
  ctx.fillStyle = d; ctx.fillRect(x + t, y + h - 2 * t, w - 2 * t, t); ctx.fillRect(x + w - 2 * t, y + t, t, h - 2 * t);
}
function titleBar(x, y, w, h, mode = 'on') {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  const [c1, c2] = mode === 'alert' ? ['#800000', '#e02020'] : mode === 'off' ? [C.lo, '#b0b0b0'] : [C.navy, C.title2];
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
}

function drawIcon(c, type, x, y, s) {
  const r = (ax, ay, w, h, col) => { c.fillStyle = col; c.fillRect(x + ax * s, y + ay * s, w * s, h * s); };
  if (type === 'window') {
    r(2, 4, 20, 16, C.dk); r(3, 5, 18, 14, '#fff'); r(3, 5, 18, 4, C.navy);
    r(5, 11, 12, 1, C.lo); r(5, 14, 9, 1, C.lo); r(5, 17, 11, 1, C.lo);
  } else if (type === 'node') {
    r(3, 10, 4, 4, C.navy);
    for (const [ox, h] of [[9, 8], [13, 12], [17, 16]]) { r(ox, 12 - h / 2, 2, h, C.navy); }
  } else if (type === 'handler') {
    r(3, 7, 15, 2, C.dk); r(16, 5, 2, 6, C.dk); r(18, 6, 2, 4, C.dk); r(20, 7, 1, 2, C.dk);
    r(6, 15, 15, 2, C.dk); r(6, 13, 2, 6, C.dk); r(4, 14, 2, 4, C.dk); r(3, 15, 1, 2, C.dk);
  } else if (type === 'codec') {
    for (let i = 0; i < 4; i++) r(1 + i * 4, 8, 3, 8, C.navy);
    for (let i = 0; i < 2; i++) { r(17 + i * 3, 8, 3, 8, C.dk); r(17.5 + i * 3, 8.5, 2, 7, '#fff'); }
  } else if (type === 'store') {
    r(7, 2, 14, 18, C.dk); r(8, 3, 12, 16, '#fff');
    r(4, 5, 14, 18, C.dk); r(5, 6, 12, 16, '#fff');
    for (let i = 0; i < 4; i++) r(7, 9 + i * 3, 8, 1, C.lo);
  } else if (type === 'log') {
    r(3, 3, 15, 19, C.dk); r(4, 4, 13, 17, '#ffffe1');
    for (let i = 0; i < 4; i++) r(6, 8 + i * 3, 9, 1, C.lo);
    r(17, 12, 2, 2, C.dk); r(18, 10, 2, 2, C.dk); r(19, 8, 2, 2, '#c08000'); r(20, 6, 2, 2, '#c08000');
  }
}

// Robot on tank treads. (x, y) = middle of the tread bottom.
function drawRobot(c, x, y, s, dir, phase, moving, t) {
  const jig = moving ? Math.round(Math.sin(phase * 2.3)) * 0.4 : 0;   // engine rumble
  const r = (ax, ay, w, h, col) => { c.fillStyle = col; c.fillRect(x + ax * s, y + (ay + jig) * s, w * s, h * s); };
  c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(x - 15 * s, y - 1 * s, 30 * s, 3 * s);   // shadow

  // tread: dark belt, moving link marks top and bottom, rolling wheels
  r(-14, -9, 28, 9, '#202020');
  r(-13, -8, 26, 7, '#383838');
  const off = ((phase * dir * 1.6) % 4 + 4) % 4;
  for (let k = -14; k < 14; k += 4) {
    const top = -13 + ((k + 13 + off) % 26 + 26) % 26;
    const bot = -13 + ((k + 13 - off) % 26 + 26) % 26;
    r(top, -9, 1.5, 1.2, '#707070');
    r(bot, -1.2, 1.5, 1.2, '#707070');
  }
  for (const wx of [-9.5, -3.2, 3.2, 9.5]) {
    const cx = x + wx * s, cy = y + (-4.5 + jig) * s, rad = 2.6 * s;
    c.fillStyle = '#909090'; c.beginPath(); c.arc(cx, cy, rad, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#202020'; c.lineWidth = 0.6 * s;
    const a = phase * dir * 1.3;
    c.beginPath(); c.moveTo(cx - Math.cos(a) * rad, cy - Math.sin(a) * rad); c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); c.stroke();
    c.fillStyle = '#202020'; c.fillRect(cx - 0.6 * s, cy - 0.6 * s, 1.2 * s, 1.2 * s);
  }

  r(-10, -24, 20, 15, C.dk); r(-10, -24, 19, 14, C.hi); r(-9, -23, 18, 13, C.face);       // body
  r(-6, -21, 12, 7, C.desk); r(-5, -19 + ((t * 2) % 5), 10, 1, '#5fd0d0');                   // chest screen
  r(-2, -27, 4, 3, C.lo);                                                                       // neck
  r(-9, -39, 18, 12, C.dk); r(-9, -39, 17, 11, C.hi); r(-8, -38, 16, 10, C.face);              // head
  const blink = (t % 3.2) < 0.12;
  if (!blink) { r(-5 + dir, -35, 3, 3, C.dk); r(2 + dir, -35, 3, 3, C.dk); } else { r(-5 + dir, -34, 3, 1, C.dk); r(2 + dir, -34, 3, 1, C.dk); }
  r(-0.5, -44, 1, 5, C.dk);
  r(-1.5, -47, 3, 3, (t % 1.4) < 0.7 ? '#ff2020' : '#20c020');                                // antenna light
}

function drawPortrait(type) {
  const pc = document.getElementById('pf').getContext('2d');

  pc.fillStyle = C.face; pc.fillRect(0, 0, 30, 30);

}

function drawVoid() {
  ctx.fillStyle = C.voidc; ctx.fillRect(-3000, -3000, W + 6000, H + 6000);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let gx = 0; gx < W; gx += 90) for (let gy = 0; gy < H; gy += 90) ctx.fillRect(gx + ((gy / 90) % 2) * 45, gy, 3, 3);
}
function drawBoard(n) {
  const b = BOARD[n], on = alert(n), blink = on && (simTime % 800) < 400;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(b.x + 30, b.y + 30, BW, BH);   // drop shadow into the void
  bevel(b.x, b.y, BW, BH, true, C.face, 5);
  titleBar(b.x + 8, b.y + 8, BW - 16, TITLE - 14, on ? 'alert' : 'on');
  txt(`Node ${n} — ${INFO[n].ip}:${INFO[n].port}${on ? (blink ? '   ⚠ DEFENSIVE PROTOCOL' : '') : ''}`, b.x + 28, b.y + 54, 40, '#fff', true);
  for (let i = 0; i < 3; i++) bevel(b.x + BW - 66 - i * 56, b.y + 16, 48, 42, true, C.face, 3);
  txt('×', b.x + BW - 42, b.y + 50, 34, '#000', true, 'center');
  const f = floor(n);
  bevel(f.x, f.y, f.w, f.h, false, '#b4b4b4', 3);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let gx = f.x + 30; gx < f.x + f.w; gx += 60) for (let gy = f.y + 30; gy < f.y + f.h; gy += 60) ctx.fillRect(gx, gy, 4, 4);
  // TCP dock on the bottom edge

}

function drawPasswordBoard() {

function strokePts(pts, width, color) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const p of pts.slice(1)) ctx.lineTo(p.x, p.y); ctx.stroke();
}
function drawWires() {
  for (const n of ['A', 'B']) {
    for (const [s, e] of WIRES) {
      const pts = [center(P[`${n}.${s}`]), center(P[`${n}.${e}`])];
      strokePts(pts, 16, C.lo); strokePts(pts, 8, '#505050');
    }
    const stub = [center(P[`${n}.codec`]), dock(n)];   // codec to dock, inside the board
    strokePts(stub, 16, C.lo); strokePts(stub, 8, '#505050');
  }
}
function drawCable() {
  const pts = bridgePts('A');
  const mid = pts[24];
  if (tcp === 'up' || robot.ride) {
    strokePts(pts, 26, C.dk); strokePts(pts, 13, tcp === 'up' ? '#e8e800' : '#807000');
    labelBox(tcp === 'up' ? 'TCP connection' : 'connection closing…', mid.x, mid.y + 80, false, 34);
  } else {
    ctx.setLineDash([16, 24]); strokePts(pts, 6, 'rgba(255,255,255,0.3)'); ctx.setLineDash([]);
    labelBox('no connection', mid.x, mid.y + 80, true, 34);
  }
  if (handshake) {
    ctx.setLineDash([22, 18]); ctx.lineDashOffset = -simTime / 8; strokePts(pts, 8, '#5fa0ff'); ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }
}
function labelBox(s, x, y, faint, size = 18) {
  font(size, false); const w = ctx.measureText(s).width + size * 0.8;
  ctx.globalAlpha = faint ? 0.6 : 1;
  ctx.fillStyle = C.tip; ctx.fillRect(x - w / 2, y - size, w, size * 1.4);

// SOUND — all made live with the Web Audio API (no sound files).
// Browsers allow sound only after the first click or key press.
// =====================================================================
const audio = { ctx: null, on: true };
const BPM = 92, STEP = 60 / BPM / 4;                                       // one 16th note
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];   // Am F C G

  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;

  audio.musicFilter = a.createBiquadFilter(); audio.musicFilter.type = 'lowpass'; audio.musicFilter.frequency.value = 6000;

  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  o.connect(g); for (const d of Array.isArray(dests) ? dests : [dests]) g.connect(d);

}

// ---------- the soundtrack: four chiptune tracks ----------
// quiz: while a quiz is open · victory: one 3-minute pass after a passed quiz
// room: inside a machine · ambient: everywhere else. Earlier in the list wins.
const TRACKS = {
  ambient: { bpm: BPM, play: playAmbient },
  room:    { bpm: 132, play: playRoom },
  quiz:    { bpm: 100, play: playQuiz },
  victory: { bpm: 140, play: playVictory },
};
const VICTORY_SECONDS = 180;
let victoryEnd = 0;   // audio time when the victory track stops
function startVictory() { if (audio.ctx) { victoryEnd = audio.ctx.currentTime + VICTORY_SECONDS; audio.track = null; } }
function wantedTrack() {
  if (quiz.phase === 'ask') return 'quiz';
  if (audio.ctx && audio.ctx.currentTime < victoryEnd) return 'victory';
  return scene.kind === 'inside' ? 'room' : 'ambient';
}
function musicTick() {
  const a = audio.ctx, want = wantedTrack();
  if (want !== audio.track) {   // switch: start the new track from its beginning
    audio.track = want; audio.step = 0;
    audio.next = Math.max(audio.next, a.currentTime + 0.05);
    audio.echo.delayTime.setValueAtTime(60 / TRACKS[want].bpm / 4 * 3, audio.next);
  }
  const tr = TRACKS[audio.track], st = 60 / tr.bpm / 4;   // one 16th note

}

  tone(mtof(chord[s % 3] + 12 + (s >= 8 ? 12 : 0)), t, STEP * 0.9, 'square', 0.06, [audio.music, audio.echo]);
  if (s % 2 === 0) noiseHit(t, 0.03, 'highpass', 8000, s % 4 === 2 ? 0.08 : 0.04, audio.music);
  if (bar % 8 >= 4 && s % 2 === 0) {
    const m = LEAD[Math.floor((i % 32) / 2)];
    if (m) tone(mtof(m), t, STEP * 1.8, 'square', 0.035, [audio.music, audio.echo]);

// Room: a whimsical factory tune. Oom-pah bass, plinky arpeggio, clanks and steam.
const ROOM_CHORDS = [[53, 57, 60], [58, 62, 65], [60, 64, 67], [53, 57, 60], [50, 53, 57], [55, 58, 62], [60, 64, 67], [53, 57, 60]];   // F Bb C F Dm Gm C F
