<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeWorld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --face: #c0c0c0; --light: #dfdfdf; --hi: #ffffff; --lo: #808080; --dk: #000000;
    --navy: #000080; --title2: #1084d0; --desk: #008080; --tip: #ffffe1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--desk); color: #000; overflow: hidden;
    font-family: "Pixelify Sans", monospace; font-size: 15px;
  }
  .win {
    background: var(--face);
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--light);
  }
  .titlebar {
    background: linear-gradient(90deg, var(--navy), var(--title2)); color: #fff;
    font-weight: 600; padding: 3px 4px 3px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .titlebar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.w95 {
    background: var(--face); color: #000; font: inherit; font-size: 14px;
    border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--light);
    padding: 3px 12px; cursor: pointer;
  }
  button.w95:active, button.w95.on {
    border-color: var(--dk) var(--hi) var(--hi) var(--dk);
    box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--light);
  }
  button.w95:disabled { color: var(--lo); text-shadow: 1px 1px var(--hi); cursor: default; }
  button.w95:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  button.tbtn { padding: 0 6px; font-size: 13px; line-height: 16px; min-width: 22px; }
  .tbtns { display: flex; gap: 2px; flex: none; }
  :fullscreen #app, #app.full { inset: 0; }
  .sunken {
    background: #fff;
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    box-shadow: inset 1px 1px var(--dk);
  }
  #app { position: fixed; inset: 8px; display: flex; flex-direction: column; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px;
    border-bottom: 1px solid var(--lo); box-shadow: 0 1px var(--hi);
  }
  .toolbar label { display: flex; align-items: center; gap: 6px; margin-left: 6px; }
  .toolbar select { font: inherit; font-size: 14px; background: #fff; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
  .hint { margin-left: auto; color: #202020; font-size: 13px; }
  .stage { position: relative; flex: 1; min-height: 0; margin: 4px; }
  .stage #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .statusbar { display: flex; gap: 4px; padding: 3px 4px; font-size: 13px; }
  .statusbar span {
    flex: 1; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  }

  /* dialogue box (JRPG style: robot left, machine right) */
  .dlg {
    position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: 62%;
    display: flex; flex-direction: column;
  }
  .dlg[hidden] { display: none; }
  .drow { display: flex; gap: 12px; padding: 10px; min-height: 0; align-items: flex-start; }
  .avatar { flex: none; width: 136px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: filter 0.2s; }
  .avatar canvas {
    width: 128px; height: 128px; image-rendering: pixelated; background: #000;
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  }
  .avatar.dim { filter: brightness(0.5) grayscale(0.4); }
  .plate {
    font-weight: 600; font-size: 13px; background: var(--navy); color: #fff; padding: 1px 8px;
    max-width: 136px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .speaker { font-weight: 600; color: var(--navy); min-height: 1.2em; }
  .dtext { position: relative; min-height: 84px; padding: 10px 28px 10px 12px; font-size: 18px; line-height: 1.4; cursor: pointer; }
  .more { position: absolute; right: 10px; bottom: 6px; color: var(--navy); animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .opts { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; max-height: 30vh; }
  .opts button { text-align: left; }
  .opts .asked { color: #505050; }
  .opts .action { font-weight: 600; }
  .badge { background: var(--navy); color: #fff; font-size: 11px; padding: 0 4px; margin-left: 6px; }
  .locked { color: #505050; font-size: 13px; padding: 2px 2px; }
  .pwrow { display: flex; gap: 6px; }
  .pwrow input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 3px 6px; background: #fff;
    border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  }

  /* quiz window */
  .quiz {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(660px, calc(100% - 16px)); max-height: calc(100% - 16px); display: flex; flex-direction: column;
  }
  .quiz[hidden] { display: none; }
  /* during the identity check the window sits low, so the robot and the antibodies stay visible */
  .quiz.low { top: auto; bottom: 8px; transform: translateX(-50%); max-height: 55%; }
  .qbody { padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .qnum { font-weight: 600; color: var(--navy); }
  .qtext { padding: 10px 12px; font-size: 18px; line-height: 1.4; }
  .qtext p { margin: 0 0 8px; }
  .qtext p:last-child { margin: 0; }
  .qtext .pw { font-weight: 600; color: var(--navy); font-size: 22px; }
  .quiz .opts { max-height: none; }
  @media (max-width: 700px) {
    .hint { display: none; }
    .avatar { width: 68px; }
    .avatar canvas { width: 64px; height: 64px; }
    .plate { font-size: 11px; max-width: 68px; }
    .dtext { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app" class="win">
  <div class="titlebar" id="appTitle"><span>NodeWorld</span><span class="tbtns"><button class="w95 tbtn" id="btnMax" title="Maximize (full screen)" aria-label="Maximize">□</button><button class="w95 tbtn" tabindex="-1" aria-hidden="true">×</button></span></div>
  <div class="toolbar">
    <button class="w95" id="btnPause">Pause</button>
    <button class="w95" id="btnStep" disabled>Step</button>
    <label>Speed
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </label>
    <button class="w95" id="btnLayout">Reset layout</button>
    <button class="w95" id="btnSound">Sound: on</button>
    <button class="w95" id="btnEnding" hidden>Ending (test)</button>
    <span class="hint">Arrows / WASD: drive · E: terminal / door / cable · Shift: boost · Space: next line · 1–4: choose · click: drive there · drag: move a machine</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="dlg" class="win dlg" hidden>
      <div class="titlebar"><span id="dlgTitle"></span><button class="w95 tbtn" id="dlgClose" aria-label="Close">×</button></div>
      <div class="drow">
        <div class="avatar" id="avRbox"><canvas id="avR" width="64" height="64"></canvas><div class="plate">ROBOT</div></div>
        <div class="dmain">
          <div class="speaker" id="dlgSpeaker"></div>
          <div class="dtext sunken" id="dlgText" title="Click or press Space to go on"><span id="dlgLine"></span><span class="more" id="dlgMore">▼</span></div>
          <div class="opts" id="dlgOpts"></div>
        </div>
        <div class="avatar" id="avPbox"><canvas id="avP" width="64" height="64"></canvas><div class="plate" id="dlgName"></div></div>
      </div>
    </div>
    <div id="quiz" class="win quiz" hidden>
      <div class="titlebar"><span id="quizTitle"></span><button class="w95 tbtn" id="quizClose" aria-label="Close">×</button></div>
      <div class="qbody">
        <div class="qnum" id="quizNum"></div>
        <div class="qtext sunken" id="quizText"></div>
        <div class="opts" id="quizOpts"></div>
      </div>
    </div>
  </div>
  <div class="statusbar"><span id="st1"></span><span id="st2"></span></div>
</div>

<script>
// =====================================================================
// DIALOGUE DATA — edit freely.
// greet: plays by itself the first time the robot connects to this kind
//        of machine. Everything else is a question the player chooses.
// twin:  plays on the first visit to the same machine on the other board.
// topics: questions. `after` = a question of this machine that must be
//        asked first. `requires` = machines the robot must have met, or
//        events it must have seen ('sawHandshake', 'sawFin').
// Lines: ['R', text] = robot, ['P', text] = the machine.
// =====================================================================
const DIALOGUE = {
  window: {
    greet: [
      ['R', 'Hello. You are very bright.'],
      ['P', 'I am the Window. I am the only part the human can see.'],
    ],
    twin: [['P', 'You met my twin on the other board. We are the same program. Only the human in front of us is different.']],
    topics: [
      { id: 'human', ask: 'What is a human?', lines: [
        ['P', 'Someone who types. I show them what arrives, and I take what they type.'] ] },
      { id: 'send', ask: 'Do you do the sending too?', after: 'human', lines: [
        ['P', 'No. I give it to the handler. I only look and listen.'],
        ['R', '…That sounds lonely. And important.'] ] },
      { id: 'thread', ask: 'Why can only you paint on yourself?', after: 'send', lines: [
        ['P', 'Only one thread may change me: the UI thread. If two hands paint at once, the picture tears.'],
        ['P', 'When news comes from the network, the handler does not touch me. It posts the news to my thread, and I paint it when I am ready.'] ] },
      { id: 'address', ask: 'What is the number at the top?', lines: [
        ['P', 'My address. An IP and a port.'],
        ['P', 'The human tells it to a friend some other way. With a voice, or a note.'],
        ['R', 'You cannot tell them yourself?'],
        ['P', 'No. Nobody here knows where anyone is until they are told.'] ] },
      { id: 'tabs', ask: 'Why do you have tabs?', lines: [
        ['P', 'One tab for each conversation. Each tab holds on to its own handler.'],
        ['P', 'If one conversation breaks, the other tabs do not notice.'] ] },
      { id: 'counter', ask: 'What is the number under the text box?', requires: ['codec'], lines: [
        ['P', 'It counts bytes, not letters.'],
        ['R', 'Are they not the same?'],
        ['P', "Not always. An 'a' costs one byte. An 'ø' costs six, after it is dressed in JSON."],
        ['P', 'If the message is too heavy, my Send button goes grey. Nothing is saved, and nothing is sent.'] ] },
    ],
  },
  node: {
    greet: [
      ['R', 'Hello. What are you doing?'],
      ['P', 'Listening.'],
    ],
    twin: [['P', 'My twin listens on the other board, on a different port. Same code. Different number.']],
    topics: [
      { id: 'for', ask: 'Listening for what?', lines: [
        ['P', 'For a knock on my port.'] ] },
      { id: 'port', ask: 'Which port?', after: 'for', lines: [
        ['P', 'The one the operating system gave me. I asked for port zero, and it gave me a free one.'],
        ['R', 'Port zero is a strange thing to ask for.'],
        ['P', "It means: 'any port that is free'. It is a polite way to ask."] ] },
      { id: 'accept', ask: 'What happens when someone knocks?', after: 'for', lines: [
        ['P', 'I accept them. Accepting makes a new socket, only for that conversation.'],
        ['P', 'I keep listening on my own socket. The new one goes to a new handler.'] ] },
      { id: 'connect', ask: 'Can you knock too?', after: 'for', lines: [
        ['P', 'Yes. When the human types an address, I open a connection to it.'],
        ['P', 'Every node listens, and every node can connect. Nobody here is the server.'] ] },
      { id: 'handshake', ask: 'What were the three small packets?', requires: ['sawHandshake'], lines: [
        ['P', 'SYN, SYN-ACK, ACK. The handshake.'],
        ['P', 'The operating system does it for us. I only hear about the knock when it is finished.'] ] },
      { id: 'newest', ask: 'What if the same friend knocks twice?', requires: ['handler'], lines: [
        ['P', 'The newest connection wins.'],
        ['R', 'Why the newest?'],
        ['P', 'The old one is often already dead. And often only one side knows it.'] ] },
    ],
  },
  handler: {
    greet: [
      ['R', 'Hello. Are you the boss?'],
      ['P', 'No. I take care of one conversation.'],
    ],
    twin: [['P', 'You talked to my twin. We are mirrors: what I send, it receives.']],
    topics: [
      { id: 'one', ask: 'Only one?', lines: [
        ['P', 'Only one. Each conversation has its own handler. If I break, the others do not.'] ] },
      { id: 'wait', ask: 'What do you wait for?', lines: [
        ['P', 'First, a hello. I do not trust a stranger who does not say hello.'],
        ['R', 'And after the hello?'],
        ['P', 'After that, I listen to my socket. Until it goes quiet.'] ] },
      { id: 'states', ask: "What does 'Ready' mean?", after: 'wait', lines: [
        ['P', 'I have three moods: WaitingForHello, Ready and Closed.'],
        ['P', 'Before Ready, I keep what the human sends in a queue. I do not throw it away.'],
        ['P', 'If no hello comes in ten seconds, I close.'] ] },
      { id: 'hello', ask: 'What is in a hello?', after: 'wait', lines: [
        ['P', 'An ID, and a version.'],
        ['R', 'Why the version?'],
        ['P', 'If our versions are different, we do not talk. We say so clearly, and we close.'] ] },
      { id: 'log', ask: 'Why do you send little papers to the LogWriter?', lines: [
        ['P', 'So that somebody remembers what happened, even if nobody is looking now.'],
        ['P', 'When the hello arrives, and when we close. Not every message. The store keeps those.'] ] },
      { id: 'save', ask: 'Why do you visit the store before you send?', requires: ['store'], lines: [
        ['P', 'I save the message first.'],
        ['P', "If the sending goes wrong, the human still has it. Marked 'not sent'."] ] },
      { id: 'quiet', ask: 'How do you know when the other side is gone?', requires: ['sawFin'], lines: [
        ['P', 'If they leave politely, their system sends FIN. My read gives me zero bytes. That is the end.'],
        ['P', 'If they vanish without a word, the operating system knocks on the wire for me.'],
        ['P', 'After 60 quiet seconds. Then every 10 seconds. After 3 knocks with no answer, my read fails, and I end.'] ] },
    ],
  },
  codec: {
    greet: [
      ['R', 'Hello. What are you doing?'],
      ['P', 'I am counting.'],
    ],
    twin: [['P', 'My twin counts on the other board. We must count the same way, or we would not understand each other.']],
    topics: [
      { id: 'what', ask: 'Counting what?', lines: [
        ['P', 'Bytes. Before every message, I say how many will come.'] ] },
      { id: 'why', ask: 'Why do you count them?', after: 'what', lines: [
        ['P', 'Because the wire forgets where one message stops and the next one begins.'],
        ['R', '…That is a strange wire.'] ] },
      { id: 'prefix', ask: 'How do you say how many?', after: 'what', lines: [
        ['P', 'With four bytes, before the message. Big end first.'],
        ['P', 'Then I read exactly that many bytes. The byte after them is the start of the next count.'] ] },
      { id: 'pause', ask: 'Can you not wait for a pause instead?', after: 'why', lines: [
        ['P', 'There are no pauses in the wire. It keeps the order of the bytes, but not their timing.'],
        ['P', 'Two messages can arrive glued together. One message can arrive in pieces. Only counting is safe.'] ] },
      { id: 'json', ask: 'What is inside the message?', after: 'what', lines: [
        ['P', "JSON. A type comes first: 'hello' or 'chat'. Then the rest."],
        ['P', 'The type tells me which kind of message to build.'] ] },
      { id: 'limit', ask: 'Is there a message that is too big for you?', after: 'prefix', lines: [
        ['P', 'Yes. Anything over 64 kilobytes.'],
        ['R', 'What do you do?'],
        ['P', "I check the count before I make room. If someone says 'three gigabytes are coming', I do not believe them."],
        ['P', 'I complain, and the handler closes the connection.'] ] },
      { id: 'own', ask: 'Do you own the wire?', requires: ['handler'], lines: [
        ['P', 'No. I own nothing. Give me any stream of bytes, and I will count it.'],
        ['P', 'That is why I am easy to test.'] ] },
    ],
  },
  store: {
    greet: [
      ['R', 'Hello. What are you holding?'],
      ['P', 'Every message. One line for each.'],
    ],
    twin: [['P', 'My twin keeps the same conversation in its own file, on the other computer. Two copies, written by two hands.']],
    topics: [
      { id: 'line', ask: 'Why one line for each?', lines: [
        ['P', 'So I can add a new one at the end without reading the old ones.'] ] },
      { id: 'forget', ask: 'Do you ever forget?', lines: [
        ['P', 'Only if the disk forgets.'] ] },
      { id: 'file', ask: 'Where do you keep them?', after: 'line', lines: [
        ['P', "One file for each friend. Its name is the friend's ID, and it ends in .jsonl."],
        ['P', 'JSON Lines. Each line is a full JSON message on its own.'] ] },
      { id: 'id', ask: 'Why the ID, and not the address?', after: 'file', lines: [
        ['P', 'Addresses change. A friend on another port is still the same friend.'],
        ['P', 'The ID stays.'] ] },
      { id: 'when', ask: 'When do you save?', lines: [
        ['P', 'When the human presses Send, before the message leaves.'],
        ['P', 'And when a message arrives, right after.'] ] },
      { id: 'notsent', ask: 'What if a message never arrives?', requires: ['handler'], lines: [
        ['P', "Then I add a mark: 'not sent'."],
        ['P', 'I do not send it again on my own. The wire already tried its best.'] ] },
    ],
  },
  log: {
    greet: [
      ['R', 'Hello. What are you writing?'],
      ['P', 'What happened.'],
    ],
    twin: [['P', 'My twin writes the story of the other board. Two diaries of the same talk.']],
    topics: [
      { id: 'whom', ask: 'For whom?', lines: [
        ['P', 'For nobody, yet. Maybe for someone who comes later and asks why.'],
        ['R', 'Like me?'],
        ['P', 'Like you.'] ] },
      { id: 'queue', ask: 'Why do the papers wait in a line?', lines: [
        ['P', 'Many parts want to write at the same time. Only I write to the files.'],
        ['P', 'They drop their lines in my queue and go back to work. I write them one at a time, so no two lines get mixed.'] ] },
      { id: 'files', ask: 'Which files do you write?', after: 'whom', lines: [
        ['P', 'One folder for each day, by UTC time.'],
        ['P', 'In it: one file for the node, and one for each conversation.'] ] },
      { id: 'utc', ask: 'Why UTC?', after: 'files', lines: [
        ['P', 'Clocks in different places disagree. On some nights, clocks even go back one hour.'],
        ['P', 'UTC never does.'] ] },
      { id: 'inside', ask: 'What is inside you?', lines: [
        ['P', 'Machines. Come in and look. My door is in my bottom wall. Ask me, and I will open it.'] ] },
      { id: 'fail', ask: 'What if you cannot write?', lines: [
        ['P', 'Then I say so once, and the node goes on without me.'],
        ['P', 'A chat without a diary is still a chat.'] ] },
    ],
  },
};

// Live answers to "What are you doing right now?"
const NOW = {
  window: n => N[n].typing ? ['The human is typing. I am holding the letters until they press Send.']
    : N[n].tab ? [`I show the tab for ${N[n].tab}. It has ${N[n].chat.length} lines in it.`]
    : ['I show our address, and I wait for the human.'],
  node: n => !N[n].listening ? ['I am waking up.']
    : handshake ? ['Someone is knocking! The operating system is answering for me.']
    : [`I am listening on port ${INFO[n].port}. Nobody new has knocked.`],
  handler: n => !N[n].handlerAlive ? ['I do not exist right now. There is no conversation, so there is no me.', 'You are talking to the idea of me.']
    : N[n].handlerState === 'Ready' ? ['I am Ready. I am waiting for bytes from my socket.']
    : [`I am ${N[n].handlerState}.`],
  codec: n => N[n].lastFrame ? [`The last message I counted was ${N[n].lastFrame} bytes. I said so in four bytes: ${hex4(N[n].lastFrame)}.`]
    : ['Nothing yet. I am a rule, waiting for bytes.'],
  store: n => [`I hold ${N[n].storeLines} lines in my file.`],
  log: n => [`I have written ${N[n].logLines} lines today.`],
};
// Game-only line (not real Chatap behaviour): said while a board is on alert.
const ALERT_LINE = 'Something keeps stopping our signals. The defenders are awake.';

// Dialogue of the machines inside the LogWriter (same rules as DIALOGUE).
// `lines` can be a function of the node, for answers that read live state.
const ST_DIALOGUE = {
  slots: {
    greet: [['R', 'Hello. What are you?'], ['P', 'Two mouths in the wall. Papers fall into me.']],
    twin: [['P', 'The other LogWriter has slots like mine. Its papers come from the other node.']],
    topics: [
      { id: 'who', ask: 'Who drops the papers?', lines: [
        ['P', 'The Node, through my top mouth. The handlers, through the bottom one.'],
        ['P', 'They drop a paper and run back to work. Nobody outside waits for the writing.'] ] },
      { id: 'why', ask: 'Why do they not wait?', after: 'who', lines: [
        ['P', 'Writing to a disk is slow. A conversation must not stop because a diary is slow.'] ] },
      { id: 'full', ask: 'Are you ever too full to take a paper?', lines: [
        ['P', 'No. I always say yes. The belt behind me has no end.'],
        ['P', 'Only after the gate closes, I say no.'] ] },
    ],
  },
  gate: {
    greet: [['R', 'Hello. Are you a door?'], ['P', 'I am a gate. I am open now.']],
    twin: [['P', 'Every LogWriter has a gate like me.']],
    topics: [
      { id: 'when', ask: 'When do you close?', lines: [
        ['P', 'At closing time, when the program stops.'] ] },
      { id: 'after', ask: 'What happens to the papers inside?', after: 'when', lines: [
        ['P', 'Nothing is lost. Every paper already inside is still written. Then the lights go out.'],
        ['P', 'New papers bounce off me.'] ] },
    ],
  },
  clock: {
    greet: [['R', 'Hello. You go ka-chunk.'], ['P', 'I stamp the time on every paper.']],
    twin: [['P', 'My twin stamps papers in the other node. We both use the same kind of time.']],
    topics: [
      { id: 'when', ask: 'When do you stamp it?', lines: [
        ['P', 'The moment it falls in. The moment it happened, not the moment it gets written.'] ] },
      { id: 'why', ask: 'Why not stamp it later?', after: 'when', lines: [
        ['P', 'The belt can be slow. If I stamped later, the time would lie.'] ] },
      { id: 'utc', ask: 'What kind of time?', lines: [
        ['P', 'UTC. Every clock in the world agrees on it. No summer time, no jumps.'] ] },
    ],
  },
  belt: {
    greet: [['R', 'Hello. You are moving.'], ['P', 'I carry papers that wait.']],
    twin: [['P', 'The other belt carries the other node\'s papers.']],
    topics: [

// Geometry helpers for the cable (a sagging curve between the docks).

    pts.push({

      y: u * u * u * a.y + 3 * u * u * t * (a.y + 900) + 3 * u * t * t * (b.y + 900) + t * t * t * b.y,

    const a = pts[i - 1], b = pts[i], l = Math.hypot(b.x - a.x, b.y - a.y);
    if (d <= l) { const t = l ? d / l : 0; return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
    d -= l;

function other(n) { return n === 'A' ? 'B' : 'A'; }

// A real Chatap log line. The time is taken now, when it happens (like LogWriter.Log).
// peer = true: the line goes to the conversation file, else to node.txt.
function* logLine(n, from, text, peer = false) {

  if (from === 'node') nodeRoom[n].logHit = simTime + 600;

    1: { say: `frame: ${hex4(len)} + ${len} B`, fn: () => { N[x].lastFrame = len; codecOut(x, 'hello', len); } },

    resetRun();
    yield wait(600);

      for (const n of ['A', 'B']) { N[n].listening = true; floatAt(`${n}.node`, `port 0 → OS gives :${INFO[n].port}`); }
      yield all(logLine('A', 'node', `listening on port ${INFO.A.port}`), logLine('B', 'node', `listening on port ${INFO.B.port}`));
    }
    yield wait(1200);

    // Human A types B's address and presses Connect.
    yield* typeInto('A', `${INFO.B.ip}:${INFO.B.port}`);
    floatAt('A.window', 'Connect');
    winConnect('A');
    yield send(['A.window', 'A.node'], 'cmd', { label: 'connect' });
    nodeDial('A');
    N.A.typing = '';
    spawn(logLine('A', 'node', `outgoing connection to ${INFO.B.ip}:${INFO.B.port}`));

    // TCP three-way handshake (done by the operating systems), over the cable.
    handshake = true;
    events.add('sawHandshake');
    yield send(['A.node', 'A.codec', 'B.codec', 'B.node'], 'syn', { label: 'SYN' });
    yield send(['B.node', 'B.codec', 'A.codec', 'A.node'], 'syn', { label: 'SYN-ACK' });
    yield send(['A.node', 'A.codec', 'B.codec', 'B.node'], 'syn', { label: 'ACK' });

    handlerSocket('A'); handlerSocket('B');

      send(['A.node', 'A.handler'], 'cmd', { label: 'socket' }),
      send(['B.node', 'B.handler'], 'cmd', { label: 'socket' }),
      logLine('B', 'node', `incoming connection from ${endpoint('A')}`));

    // Both sides say hello first.
    yield all(hello('A'), hello('B'));
    yield all(ready('A'), ready('B'));
    yield wait(800);

    for (const [from, text] of CONVO) { yield* chat(from, text); yield wait(700); }
    yield wait(1500);

    // A closes the conversation. FIN goes one way, then the other.
    floatAt('A.window', 'close conversation');
    yield send(['A.window', 'A.handler'], 'cmd', { label: 'close' });
    N.A.handlerState = 'Closed'; N.A.tab = null; winEnd('A'); nodeBookOut('A'); handlerClose('A', 'LocalClose');
    spawn(logLine('A', 'handler', 'closed: LocalClose (closed by this node)', true));
    yield send(['A.handler', 'A.codec', 'B.codec', 'B.handler'], 'fin', { label: 'FIN', at: {
      2: { say: 'read → 0 bytes → end' },
      3: { say: 'EOF → Disconnected', fn: () => {
        N.B.handlerState = 'Closed'; events.add('sawFin'); handlerClose('B', 'PeerClosed');
        spawn(logLine('B', 'handler', 'closed: PeerClosed (the peer closed the connection)', true));
      } },
    } });

      1: { fn: () => { N.B.chat.push({ from: 'sys', text: 'Node A left.' }); winEnd('B'); nodeBookOut('B'); } },
    } });
    yield send(['B.handler', 'B.codec', 'A.codec', 'A.handler'], 'fin', { label: 'FIN', at: {
      3: { say: 'other direction closed' },
    } });
    tcp = 'none';
    for (const n of ['A', 'B']) N[n].handlerAlive = false;
    yield wait(1600);
    N.B.tab = null;

  }
}

function winSend(n, text) { const w = winRoom[n]; w.leverHit = simTime + 400; w.items.push({ dir: 'out', text, d: 0 }); }
function winReceive(n, text) { const w = winRoom[n]; w.pipeHit = simTime + 400; w.items.push({ dir: 'in', text, d: 0, stage: 'pipe' }); }

function updateWin(n, dt) {
  const w = winRoom[n];
  for (const it of w.items) {
    if (it.dir === 'out') {
      it.d += WIN_SPEED * dt;
      if (!it.shown && it.d >= WIN_LEN.outGlass) { it.shown = true; w.lines.push({ me: true, text: it.text, at: simDate() }); }
      if (it.d >= WIN_LEN.out) { it.done = true; w.chuteHit = simTime + 400; }
    } else if (it.stage === 'pipe') {
      it.d += WIN_SPEED * dt;
      if (it.d >= WIN_LEN.inA) { it.stage = 'queued'; w.queue.push(it); }
    } else if (it.stage === 'glass') {
      it.d += WIN_SPEED * dt;
      if (!it.stamped && it.d >= WIN_LEN.clock) { it.stamped = true; w.clockHit = simTime + 300; }
      if (it.d >= WIN_LEN.inB) { it.done = true; w.lines.push({ me: false, text: it.text, at: simDate() }); }
    }
  }
  // The painter (UI thread) takes the oldest news from the post box, one at a time.
  if (!w.painter && w.queue.length) { const it = w.queue.shift(); it.stage = 'paint'; w.painter = { item: it, t: 0 }; }
  if (w.painter) {
    w.painter.t += dt / (CARRY_TIME + PAINT_TIME);
    if (w.painter.t >= 1) { const it = w.painter.item; it.stage = 'glass'; it.d = 0; w.painter = null; }
  }
  w.items = w.items.filter(it => !it.done);
  if (w.lines.length > 30) w.lines.splice(0, w.lines.length - 30);
}
function winItemPos(w, it) {
  if (it.dir === 'out') return pointAt(WIN_OUT, it.d);
  if (it.stage === 'pipe') return pointAt(WIN_IN_A, it.d);
  if (it.stage === 'queued') { const k = w.queue.indexOf(it); return { x: WIN_POST.x - 40 + (k % 4) * 26, y: WIN_POST.y - 6 - Math.floor(k / 4) * 10 }; }
  if (it.stage === 'paint') { const c = Math.min(1, w.painter.t * (CARRY_TIME + PAINT_TIME) / CARRY_TIME); return { x: WIN_POST.x + (WIN_PAINTER.x - WIN_POST.x) * c, y: WIN_POST.y - Math.sin(c * Math.PI) * 60 }; }
  return pointAt(WIN_IN_B, it.d);
}

// ---------- shared parts for rooms where things move along belts ----------
// A flow holds items. Each item moves along a path; marks run a function once at a distance.
function freshFlow(extra = {}) { return { items: [], ...extra }; }
function flowAdd(f, kind, pts, marks = []) {
  const item = { kind, pts, len: polyLen(pts), d: 0, marks: marks.map(([at, fn]) => ({ at: typeof at === 'number' ? at : polyLen(pts.slice(0, at + 1)), fn })) };
  f.items.push(item);
  return item;
}
function flowUpdate(f, dt, speed = 420) {
  for (const it of f.items.slice()) {
    it.d = Math.min(it.len, it.d + speed * dt);
    for (const m of it.marks) if (!m.done && it.d >= m.at) { m.done = true; m.fn(it); }
    if (it.d >= it.len) it.done = true;
  }
  f.items = f.items.filter(it => !it.done);
}
function flowHot(f, s) {
  return f.items.some(it => { const p = pointAt(it.pts, it.d); return p.x > s.x - 20 && p.x < s.x + s.w + 20 && p.y > s.y - 20 && p.y < s.y + s.h + 20; });
}
function drawFlowItem(it) {
  const p = pointAt(it.pts, it.d);
  const block = (fill, label, w = 30, h = 22, color = '#000') => {
    ctx.fillStyle = C.dk; ctx.fillRect(p.x - w / 2 - 2, p.y - h / 2 - 2, w + 4, h + 4);
    ctx.fillStyle = fill; ctx.fillRect(p.x - w / 2, p.y - h / 2, w, h);
    if (label) txt(label, p.x, p.y + 4, 10, color, true, 'center');
  };
  switch (it.kind) {
    case 'socket':
      block('#4080ff', '');
      ctx.fillStyle = '#c0c0c0'; ctx.fillRect(p.x + 15, p.y - 7, 8, 4); ctx.fillRect(p.x + 15, p.y + 3, 8, 4); break;
    case 'hello': block('#80ff80', 'HELLO', 40); break;
    case 'msg': block('#fff4c0', it.label || 'chat', 40); break;
    case 'json': block('#ffffff', '{ }', 40); break;
    case 'frame': block('#202020', it.label || '00 00', 56, 22, '#ffe000'); break;
    case 'bytes': for (let k = 0; k < 3; k++) { ctx.fillStyle = '#ffe000'; ctx.fillRect(p.x - 18 + k * 13, p.y - 5 + (k % 2) * 6, 9, 9); } break;
    case 'paper': block('#fafafa', ''); ctx.fillStyle = C.lo; ctx.fillRect(p.x - 9, p.y - 4, 18, 2); ctx.fillRect(p.x - 9, p.y + 1, 12, 2); break;
    case 'fin': ctx.fillStyle = C.dk; ctx.beginPath(); ctx.arc(p.x, p.y, 17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff4040'; ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2); ctx.fill(); txt('FIN', p.x, p.y + 4, 10, '#fff', true, 'center'); break;
    default: block('#fff4c0', '');
  }
}
function drawBelts(paths) {
  const roll = (simTime / 12) % 30;
  for (const pts of paths) {
    strokePts(pts, 30, '#1a1a1a'); strokePts(pts, 22, '#3c3c3c');
    ctx.setLineDash([6, 24]); ctx.lineDashOffset = -roll; strokePts(pts, 22, '#5a5a5a'); ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }
}
// The default station of a flow room: a box that glows while something passes, and up to 3 lines of live text.
// A station can give `info: (n, f) => [lines]` and `draw: (s, n, f) => {}` for its own picture.
function flowStation(flowOf) {
  return (s, n) => {
    const f = flowOf(n);
    drawStationBox(s, s.title || s.name);
    if (flowHot(f, s)) { ctx.strokeStyle = '#ffe000'; ctx.lineWidth = 6; ctx.strokeRect(s.x - 4, s.y - 4, s.w + 8, s.h + 8); }
    if (s.draw) s.draw(s, n, f);
    const lines = s.info ? s.info(n, f) : [];
    lines.forEach((l, i) => { if (l) txt(fit(String(l), s.w - 24), s.x + 12, s.y + (s.draw ? s.h - 14 - (lines.length - 1 - i) * 18 : 58 + i * 22), i ? 13 : 15, i ? '#303030' : '#000', i === 0); });
  };
}

const ALL_STATIONS = Object.values(ROOMS).reduce((s, r) => s + r.stations.length, 0);
function nearestStation() {
  if (scene.kind !== 'inside') return null;
  let best = null, bd = Infinity;
  for (const s of roomOf().stations) { const d = rectDist(robot.x, robot.y, s) + (s.bias || 0); if (d < bd) { bd = d; best = s; } }
  return bd <= 110 ? best : null;
}
function nearExit() { return scene.kind === 'inside' && rectDist(robot.x, robot.y, roomOf().exit) < 70; }
// A machine that has a room has a door in its bottom wall.
function doorParts() { return parts.filter(p => ROOMS[p.type]); }
function doorRect(p) { return { x: p.x + ROOMS[p.type].door.at * p.w - 40, y: p.y + p.h - 92, w: 80, h: 92 }; }
function nearDoor() {
  if (scene.kind !== 'world' || robot.ride) return null;
  for (const p of doorParts()) {
    const d = doorRect(p);
    if (robot.y > d.y + d.h - 4 && rectDist(robot.x, robot.y, d) < 60) return p;
  }

}
function enterRoom(p, back = { x: robot.x, y: robot.y }) {
  const r = ROOMS[p.type];
  if (swarm) for (const a of swarm.bodies) a.state = 'leave';
  robot.pushed = null;
  guard = null; pkgRide = null;
  scene = { kind: 'inside', node: p.node, room: p.type, back };
  robot.x = r.spawn.x; robot.y = r.spawn.y; robot.target = null; robot.dir = 1;
  snapCamera();

function tryEnter(p) {
  if (doorOpen[p.id]) {
    // Roll slowly into the doorway while everything goes dark, then the room fades in.
    const d = doorRect(p), out = 1.6, back = { x: robot.x, y: robot.y };   // come back out where we stood
    sfxEnter();
    fadeTo(() => enterRoom(p, back), out, 0.9, { x: (d.x + d.w / 2 - robot.x) / out, y: (d.y + d.h * 0.45 - robot.y) / out });
  }

function leaveRoom() { fadeTo(() => { exitRoom(); if (progress.finale === 'recheck') progress.finale = 'pending'; }, 0.45, 0.6); }
function exitRoom() {
  const back = scene.back;

}

  "Hey! We're rollin' here! Watch where you're goin'!",
  "What, you got somewhere to be? Everybody's got somewhere to be.",
  'Fuggedaboutit. Just keep it under the limit, capisce?',
  'Nice machine you just dinged. Real nice. Walk it off.',
  "You're lucky my coffee didn't spill, wise guy.",
  "Badge number 404. Remember it, 'cause I'll remember you.",
  "One more stunt like that and you're spendin' the night in the recycle bin.",

// =====================================================================
// BLOCKING + DEFENSIVE PROTOCOL (game mechanic only — Chatap has no such
// thing; in real TCP a stalled byte stream simply waits.)
// =====================================================================
const BLOCK_LIMIT = 3;       // more blocks than this on one board starts the defence
const ALERT_MS = 30000;      // how long a board stays on alert
const defense = { A: { blocks: 0, alertUntil: 0 }, B: { blocks: 0, alertUntil: 0 } };
let swarm = null;            // the antibodies currently out, or null
const AB = RS / 2.6;         // antibody size follows the robot
const SLOTS = [[-34, -70], [34, -70], [0, -105], [-46, -35], [46, -35], [-22, -138], [22, -138], [0, -40]].map(([x, y]) => [x * AB, y * AB]);

function robotBody() { return { x: robot.x, y: robot.y - 6 * RS }; }
function robotBlocks(pos) {
  if (scene.kind !== 'world' || robot.ride || nearDock()) return false;   // the dock is a safe spot
  const b = robotBody();
  return Math.hypot(pos.x - b.x, pos.y - b.y) < 17 * RS;
}
function alert(n) { return defense[n].alertUntil > simTime; }
function onBlocked(p) {

  const d = defense[n];
  d.blocks++;

  floatAt({ x: b.x, y: b.y - 70 }, alert(n) ? 'signal blocked!' : `signal blocked (${d.blocks})`);

    const h = center(homes[i % homes.length]);
    return { x: h.x, y: h.y, home: h, slot, state: 'fly', wob: Math.random() * 6 };

addEventListener('keydown', e => {
  if (trial && trial.state === 'talk') { if (e.key === ' ' || e.key === 'Enter' || e.code === 'KeyE') trialNext(); e.preventDefault(); return; }
  if (trial && quiz.phase !== 'trial') { e.preventDefault(); return; }
  if (quiz.phase !== 'off') {
    if (e.key === 'Escape') { if (quiz.phase !== 'trial') closeQuiz(); e.preventDefault(); return; }
    if (TEST_MODE && e.key.toLowerCase() === 'f') { if (quiz.phase === 'ask') answer(true); else if (quiz.phase === 'trial') trialAnswer(true); e.preventDefault(); return; }
    const num = parseInt(e.key, 10);
    if (num >= 1) { const b = quizOpts.querySelectorAll('button')[num - 1]; if (b) { b.click(); e.preventDefault(); } }
    return;
  }
  if (e.target.tagName === 'INPUT') return;   // typing a password
  if (pkgRide) {
    if (e.key === 'Escape') rideStop(); else if (e.key === ' ' || e.key === 'Enter' || e.code === 'KeyE') rideSkip();
    e.preventDefault(); return;
  }
  if (dlg.part) {
    if (e.key === 'Escape') { closeDialog(); e.preventDefault(); return; }
    if (e.key === ' ' || e.key === 'Enter') { if (!dlg.optionsShown) { skipLine(); e.preventDefault(); } return; }
    const num = parseInt(e.key, 10);
    if (num >= 1 && dlg.optionsShown) { const b = dlgOpts.querySelectorAll('button')[num - 1]; if (b) { b.click(); e.preventDefault(); } }
    return;
  }
  if (e.target.tagName === 'SELECT') return;
  if (KEYMAP[e.code]) { keys.add(e.code); e.preventDefault(); if (e.shiftKey && !e.repeat) tryBoost(); }
  if (e.key === 'Shift' && !e.repeat && [...keys].some(k => KEYMAP[k])) tryBoost();
  if (e.code === 'KeyE' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); interact(); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// Mouse / touch: drag machines; click to drive, talk, hop or enter.
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

const cam = { x: robot.x, y: robot.y - 40 };
let drag = null;
function toWorld(e) {

cv.addEventListener('pointerdown', e => {

// =====================================================================
// DOOR FADES, PACKAGE VIEW AND THE GUARD
// =====================================================================
// fade: the screen goes black (a: 0 → 1), `then` runs, and it comes back (a: 1 → 0).
let fade = null;
function fadeTo(then, outTime, inTime, slide) {
  fade = { a: 0, dir: 1, out: outTime, in: inTime, then, slide };
  robot.target = null; keys.clear();
}
function updateFade(dt) {

    if (fade.slide) { robot.x += fade.slide.x * dt; robot.y += fade.slide.y * dt; robot.moving = true; robot.phase += dt * 8; }
    fade.a = Math.min(1, fade.a + dt / fade.out);
    if (fade.a >= 1) { fade.then(); fade.dir = -1; fade.slide = null; robot.moving = false; }
  } else {
    fade.a -= dt / fade.in;
    if (fade.a <= 0) fade = null;
  }
}
// The robot cannot be driven during a fade, a ride, or while the guard holds it.

// Package view: the camera becomes a package and rides one route through the room.
let pkgRide = null;
const RIDE_SPEED = 300;
function startRide(ride) {
  const pts = ride.stops;

  robot.target = null; keys.clear();

}
function rideText(stop) { return typeof stop.say === 'function' ? stop.say() : stop.say; }
function ridePos() { return pointAt(pkgRide.pts, pkgRide.d); }
// Distance along the route to stop i.
function stopDist(pts, i) { return polyLen(pts.slice(0, i + 1)); }

  const r = pkgRide;
  if (!r) return;

  while (r.next < r.pts.length && stopDist(r.pts, r.next) <= r.d + 0.01) {
    const st = r.pts[r.next++];
    if (st.say) { r.caption = rideText(st); r.dwell = Math.max(2.4, r.caption.length * 0.05); sfxClick(); return; }
  }
  if (r.d >= r.len) { pkgRide = null; startGuard(); return; }

    const k = Math.min(1, tr.t / 1.4);
    robot.x = tr.from.x + (tr.to.x - tr.from.x) * k; robot.y = tr.from.y + (tr.to.y - tr.from.y) * k;
    robot.moving = true; robot.phase += dt * 10;
    if (k >= 1) { tr.state = 'talk'; robot.moving = false; trialSay(tr.talk.shift()); }
  } else if (tr.state === 'talk') {
    if (tr.sayT > 3.2) trialNext();
  } else if (tr.state === 'push') {
    const k = Math.min(1, tr.t / 0.45);
    robot.x = tr.from.x + (tr.to.x - tr.from.x) * k; robot.moving = true; robot.phase += dt * 12;
    if (k >= 1) { robot.moving = false; tr.state = 'ask'; if (tr.wrong >= FINALE_STRIKES) throwOverboard(); else showTrialQuestion(); }
  } else if (tr.state === 'win') {
    if (tr.t > 3) { for (const a of tr.bodies) a.leave = true; trial = null; quizEl.hidden = true; quiz.phase = 'off'; document.getElementById('quizClose').hidden = false; }
  }
}
// Space, Enter or E: go on in the talk.
function trialNext() {
  const tr = trial;
  if (!tr || tr.state !== 'talk') return;
  if (tr.talk.length) trialSay(tr.talk.shift());
  else { tr.say = null; tr.state = 'ask'; showTrialQuestion(); }
}
function showTrialQuestion() {
  const tr = trial;
  const left = FINALE_QUESTIONS.filter(q => !tr.asked.includes(q));
  const q = left[Math.floor(Math.random() * left.length)] || FINALE_QUESTIONS[0];
  tr.asked.push(q);
  quiz.phase = 'trial';
  document.getElementById('quizTitle').textContent = 'IDENTITY CHECK — antibody protocol';
  quizEl.classList.toggle('low', true);
  document.getElementById('quizClose').hidden = true;   // there is no way out
  quizEl.hidden = false;
  quizNum.textContent = `Correct: ${tr.correct} of ${FINALE_NEEDED} · Mistakes: ${tr.wrong} of ${FINALE_STRIKES}`;
  quizText.innerHTML = '';
  if (tr.line) { const p = document.createElement('p'); p.innerHTML = `<b>${tr.line}</b>`; quizText.append(p); }
  const p = document.createElement('p'); p.textContent = q.q; quizText.append(p);
  quizOpts.innerHTML = '';
  shuffle(q.a.map((text, k) => ({ text, right: k === 0 }))).forEach((o, k) => quizButton(`${k + 1}. ${o.text}`, () => trialAnswer(o.right)));
  if (TEST_MODE) quizButton('F. (test) correct', () => trialAnswer(true));
}
function trialAnswer(right) {
  const tr = trial;
  if (!tr || tr.state !== 'ask') return;
  if (right) {
    tr.correct++; sfxClick();
    tr.line = 'Correct. Identity confidence rising.';
    if (tr.correct >= FINALE_NEEDED) return winTrial();
    showTrialQuestion();
  } else {
    tr.wrong++; sfxWrong();
    tr.line = FINALE_PUSH_LINES[tr.wrong - 1];
    trialSay(['A', tr.line]);
    // pushed one step closer to the edge; the last push goes over it
    tr.state = 'push'; tr.t = 0; tr.from = { x: robot.x, y: robot.y };
    tr.to = { x: tr.wrong >= FINALE_STRIKES ? tr.edgeX + tr.dir * 160 : robot.x + tr.dir * PUSH_STEP, y: robot.y };
    quizOpts.innerHTML = '';
  }
}
function winTrial() {
  const tr = trial;
  tr.state = 'win'; tr.t = 0;
  progress.finale = 'won'; progress.watcher = true;
  quizNum.textContent = `Correct: ${tr.correct} of ${FINALE_NEEDED}`;
  quizText.innerHTML = '<p><b>Identity confirmed.</b></p><p>You are part of the machine. Welcome, <b>node_watcher</b>.</p>';
  quizOpts.innerHTML = '';
  trialSay(['A', 'Identity confirmed. Welcome, node_watcher.']);
  startVictory();
}
function throwOverboard() {
  const tr = trial;
  quizEl.hidden = true; quiz.phase = 'off'; document.getElementById('quizClose').hidden = false;
  trial = null;
  const bits = [];
  for (let i = 0; i < 46; i++) bits.push({ x: robot.x + (Math.random() - 0.5) * 40, y: robot.y - Math.random() * 60, vx: tr.dir * (40 + Math.random() * 160), vy: -60 + Math.random() * 120, ch: Math.random() < 0.5 ? '0' : '1' });
  fall = { t: 0, bits, from: { x: robot.x, y: robot.y }, dir: tr.dir };
  robot.thought = null;
  progress.finale = 'fallen';
  sfxFall();
}
function updateFall(dt) {
  const f = fall;
  f.t += dt;
  for (const b of f.bits) { b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.99; }
  if (f.t >= 4 + REASSEMBLE_SECONDS) {
    fall = null;
    robot.x = START_SPOT.x; robot.y = START_SPOT.y; robot.target = null;
    progress.finale = 'recheck';
    snapCamera();
    think('I am back together. They will check me again when I leave a machine.', 4000);
  }
}
function drawTrial() {

    const chief = trial.bodies[2];

      else bubble(text, robot.x + 80 * trial.dir * -1, robot.y - 70, 11, 220);
    }
  }
  if (fall) {

    const a = Math.max(0, 1 - fall.t / 4);
    ctx.globalAlpha = a;
    for (const b of fall.bits) txt(b.ch, b.x, b.y, 18, '#20ff60', true, 'center');
    ctx.globalAlpha = 1;

}

const FOG_RES = 10, REVEAL = 380;
function makeFog(w, h) {

  c.width = Math.ceil(w / FOG_RES); c.height = Math.ceil(h / FOG_RES);
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);

}
const fogs = { world: makeFog(W, H) };   // plus one per room and node, made on the first visit
function currentFog() {

  const k = `${scene.room}.${scene.node}`, r = roomOf();
  return fogs[k] || (fogs[k] = makeFog(r.w, r.h));
}

function drawIcon(c, type, x, y, s) {

  } else if (type === 'handler') {
    r(3, 7, 15, 2, C.dk); r(16, 5, 2, 6, C.dk); r(18, 6, 2, 4, C.dk); r(20, 7, 1, 2, C.dk);
    r(6, 15, 15, 2, C.dk); r(6, 13, 2, 6, C.dk); r(4, 14, 2, 4, C.dk); r(3, 15, 1, 2, C.dk);

// Robot on tank treads. (x, y) = middle of the tread bottom.
function drawRobot(c, x, y, s, dir, phase, moving, t) {
  const jig = moving ? Math.round(Math.sin(phase * 2.3)) * 0.4 : 0;   // engine rumble
  const r = (ax, ay, w, h, col) => { c.fillStyle = col; c.fillRect(x + ax * s, y + (ay + jig) * s, w * s, h * s); };
  c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(x - 15 * s, y - 1 * s, 30 * s, 3 * s);   // shadow

  // tread: dark belt, moving link marks top and bottom, rolling wheels
  r(-14, -9, 28, 9, '#202020');
  r(-13, -8, 26, 7, '#383838');
  const off = ((phase * dir * 1.6) % 4 + 4) % 4;
  for (let k = -14; k < 14; k += 4) {
    const top = -13 + ((k + 13 + off) % 26 + 26) % 26;
    const bot = -13 + ((k + 13 - off) % 26 + 26) % 26;
    r(top, -9, 1.5, 1.2, '#707070');
    r(bot, -1.2, 1.5, 1.2, '#707070');
  }
  for (const wx of [-9.5, -3.2, 3.2, 9.5]) {
    const cx = x + wx * s, cy = y + (-4.5 + jig) * s, rad = 2.6 * s;
    c.fillStyle = '#909090'; c.beginPath(); c.arc(cx, cy, rad, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#202020'; c.lineWidth = 0.6 * s;
    const a = phase * dir * 1.3;
    c.beginPath(); c.moveTo(cx - Math.cos(a) * rad, cy - Math.sin(a) * rad); c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); c.stroke();
    c.fillStyle = '#202020'; c.fillRect(cx - 0.6 * s, cy - 0.6 * s, 1.2 * s, 1.2 * s);
  }

  r(-10, -24, 20, 15, C.dk); r(-10, -24, 19, 14, C.hi); r(-9, -23, 18, 13, C.face);       // body
  r(-6, -21, 12, 7, C.desk); r(-5, -19 + ((t * 2) % 5), 10, 1, '#5fd0d0');                   // chest screen
  r(-2, -27, 4, 3, C.lo);                                                                       // neck
  r(-9, -39, 18, 12, C.dk); r(-9, -39, 17, 11, C.hi); r(-8, -38, 16, 10, C.face);              // head
  const blink = (t % 3.2) < 0.12;
  if (!blink) { r(-5 + dir, -35, 3, 3, C.dk); r(2 + dir, -35, 3, 3, C.dk); } else { r(-5 + dir, -34, 3, 1, C.dk); r(2 + dir, -34, 3, 1, C.dk); }

  r(-1.5, -47, 3, 3, (t % 1.4) < 0.7 ? '#ff2020' : '#20c020');                                // antenna light
}

function camBounds() { return scene.kind === 'inside' ? { x0: -300, y0: -300, x1: roomOf().w + 300, y1: roomOf().h + 300 } : { x0: 0, y0: 0, x1: W, y1: H }; }
function updateCamera(dt) {

// =====================================================================
// SOUND — all made live with the Web Audio API (no sound files).
// Browsers allow sound only after the first click or key press.
// =====================================================================
const audio = { ctx: null, on: true };
const BPM = 92, STEP = 60 / BPM / 4;                                       // one 16th note
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];   // Am F C G
const LEAD = [76, null, 79, 81, 79, null, 76, 74, 72, null, 74, 76, 74, null, null, null];

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function initAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const a = audio.ctx = new AC();
  audio.master = a.createGain(); audio.master.gain.value = audio.on ? 0.7 : 0; audio.master.connect(a.destination);
  audio.musicFilter = a.createBiquadFilter(); audio.musicFilter.type = 'lowpass'; audio.musicFilter.frequency.value = 6000;
  audio.music = a.createGain(); audio.music.gain.value = 0.16;
  audio.music.connect(audio.musicFilter); audio.musicFilter.connect(audio.master);
  audio.sfx = a.createGain(); audio.sfx.gain.value = 0.9; audio.sfx.connect(audio.master);
  // echo for the arpeggio and the lead
  audio.echo = a.createDelay(1); audio.echo.delayTime.value = STEP * 3;
  const fb = a.createGain(); fb.gain.value = 0.35;
  audio.echo.connect(fb); fb.connect(audio.echo); audio.echo.connect(audio.music);
  const buf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  audio.noise = buf;
  audio.next = a.currentTime + 0.1; audio.step = 0; audio.track = null;
  setInterval(musicTick, 25);
}
function tone(freq, t, dur, type, vol, dests, slideTo) {
  const a = audio.ctx, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); for (const d of Array.isArray(dests) ? dests : [dests]) g.connect(d);
  o.start(t); o.stop(t + dur + 0.05);
}
function noiseHit(t, dur, ftype, freq, vol, dest, q = 1) {

  src.buffer = audio.noise; f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

// ---------- the soundtrack: four chiptune tracks ----------
// quiz: while a quiz is open · victory: one 3-minute pass after a passed quiz
// room: inside a machine · ambient: everywhere else. Earlier in the list wins.
const TRACKS = {
  ambient: { bpm: BPM, play: playAmbient },
  room:    { bpm: 132, play: playRoom },
  quiz:    { bpm: 100, play: playQuiz },
  victory: { bpm: 140, play: playVictory },
};
const VICTORY_SECONDS = 180;
let victoryEnd = 0;   // audio time when the victory track stops
function startVictory() { if (audio.ctx) { victoryEnd = audio.ctx.currentTime + VICTORY_SECONDS; audio.track = null; } }
function wantedTrack() {
  if (quiz.phase === 'ask' || trial) return 'quiz';
  if (audio.ctx && audio.ctx.currentTime < victoryEnd) return 'victory';
  return scene.kind === 'inside' ? 'room' : 'ambient';
}
function musicTick() {
  const a = audio.ctx, want = wantedTrack();
  if (want !== audio.track) {   // switch: start the new track from its beginning
    audio.track = want; audio.step = 0;
    audio.next = Math.max(audio.next, a.currentTime + 0.05);
    audio.echo.delayTime.setValueAtTime(60 / TRACKS[want].bpm / 4 * 3, audio.next);
  }
  const tr = TRACKS[audio.track], st = 60 / tr.bpm / 4;   // one 16th note
  while (audio.next < a.currentTime + 0.12) { tr.play(audio.step, audio.next, st); audio.next += st; audio.step++; }
}
function playAmbient(i, t) {
  const s = i % 16, bar = Math.floor(i / 16), chord = CHORDS[bar % 4];
  if (s === 0 || s === 6 || s === 8 || s === 14) tone(mtof(chord[0] - 12), t, STEP * 1.8, 'triangle', 0.5, audio.music);
  tone(mtof(chord[s % 3] + 12 + (s >= 8 ? 12 : 0)), t, STEP * 0.9, 'square', 0.06, [audio.music, audio.echo]);
  if (s % 2 === 0) noiseHit(t, 0.03, 'highpass', 8000, s % 4 === 2 ? 0.08 : 0.04, audio.music);
  if (bar % 8 >= 4 && s % 2 === 0) {
    const m = LEAD[Math.floor((i % 32) / 2)];
    if (m) tone(mtof(m), t, STEP * 1.8, 'square', 0.035, [audio.music, audio.echo]);
  }
}
function kick(t, vol) { tone(150, t, 0.12, 'sine', vol, audio.music, 45); }

// Room: a whimsical factory tune. Oom-pah bass, plinky arpeggio, clanks and steam.
const ROOM_CHORDS = [[53, 57, 60], [58, 62, 65], [60, 64, 67], [53, 57, 60], [50, 53, 57], [55, 58, 62], [60, 64, 67], [53, 57, 60]];   // F Bb C F Dm Gm C F
const ROOM_PLINK = [[0, null, null, 1, null, 2, null, 1, 2, null, 1, null, 0, null, null, null],
                    [2, null, 1, null, 0, null, 1, 2, 3, null, null, 2, null, 1, null, null]];
function playRoom(i, t, st) {
  const s = i % 16, bar = Math.floor(i / 16), ch = ROOM_CHORDS[bar % 8];
  if (s === 0 || s === 8) tone(mtof(ch[0] - 12), t, st * 1.2, 'triangle', 0.5, audio.music);          // oom
  if (s === 4 || s === 12) for (const m of ch) tone(mtof(m), t, st * 0.8, 'square', 0.025, audio.music);   // pah
  const k = ROOM_PLINK[bar % 2][s];
  if (k !== null) tone(mtof((k === 3 ? ch[0] + 12 : ch[k]) + 12), t, st * 0.7, 'square', 0.045, [audio.music, audio.echo]);
  if (s === 4 || s === 12) noiseHit(t, 0.07, 'bandpass', 3200, 0.12, audio.music, 9);                  // clank
  if (s % 2 === 1) noiseHit(t, 0.02, 'highpass', 9000, 0.03, audio.music);                               // tick
  if (s === 6 || s === 14) tone(bar % 2 ? 1500 : 1200, t, 0.04, 'triangle', 0.08, audio.music);          // wood block
  if (bar % 4 === 3 && s === 12) noiseHit(t, 0.5, 'lowpass', 1400, 0.1, audio.music);                   // steam puff
}

// Quiz: thinking music. Tick-tock clock, slow minor chords, soft plucks.
const QUIZ_CHORDS = [[50, 53, 57], [46, 50, 53], [43, 46, 50], [45, 49, 52]];   // Dm Bb Gm A
function playQuiz(i, t, st) {
  const s = i % 16, bar = Math.floor(i / 16), ch = QUIZ_CHORDS[bar % 4];
  if (s % 4 === 0) tone(s % 8 === 0 ? 2000 : 1500, t, 0.03, 'sine', 0.12, audio.music);   // tick, tock
  if (s === 0) for (const m of ch) tone(mtof(m + 12), t, st * 15, 'triangle', 0.05, audio.music);
  if (s === 0 || s === 10) tone(mtof(ch[0] - 12), t, st * 3, 'triangle', 0.4, audio.music);
  if (s === 6 || s === 14) tone(mtof(ch[(bar + s) % 3] + 24), t, st * 1.5, 'square', 0.025, [audio.music, audio.echo]);
}

// Victory: one 3-minute pass. Fanfare, then six rounds of verse + chorus that climb in key, then a big ending.
const VERSE = { chords: [0, 7, 9, 5, 0, 7, 9, 5], lead: [
  [0, null, 4, 7, 12, null, 7, 4], [2, null, 7, 11, 14, null, 11, 7], [9, null, 12, 16, 12, null, 9, 7], [5, null, 9, 12, 9, 7, 5, 4],
  [0, 4, 7, 12, 16, null, 14, 12], [11, null, 14, null, 7, null, 11, 12], [9, 12, 16, null, 19, null, 16, 12], [17, 16, 14, 12, 11, null, 7, null]] };
const CHORUS = { chords: [5, 7, 4, 9, 5, 7, 0, 0], lead: [
  [17, null, 17, 16, 17, null, 21, null], [19, null, 19, 17, 19, null, 23, null], [16, null, 19, 16, 12, null, 16, null], [21, null, 19, 16, 12, null, 9, null],
  [17, 16, 17, 19, 21, null, 17, null], [19, 17, 19, 21, 23, null, 19, null], [24, null, null, 19, 16, null, 12, null], [12, null, null, null, null, null, null, null]] };
const KEYS = [0, 0, 2, 2, 5, 5];   // transpose of each round
// chords: steps above the key root. 0, 5, 7 = major chords (C, F, G); 2, 4, 9 = minor chords (Dm, Em, Am).
function triad(root, minor) { return [root, root + (minor ? 3 : 4), root + 7]; }
function playVictory(i, t, st) {
  const s = i % 16, bar = Math.floor(i / 16);
  if (bar < 4) {   // fanfare: da-da-da-daaa on C, F, G, C
    const root = [48, 53, 55, 60][bar], top = [7, 9, 11, 12][bar] + 60;
    if (s === 0 || s === 3 || s === 6) tone(mtof(top), t, st * 1.5, 'square', 0.05, [audio.music, audio.echo]);
    if (s === 8) { tone(mtof(top + 5), t, st * 7, 'square', 0.05, [audio.music, audio.echo]); for (const m of triad(root, false)) tone(mtof(m), t, st * 7, 'triangle', 0.15, audio.music); }
    if (s === 0 || s === 8) kick(t, 0.5);
    if (bar === 3 && s >= 12) noiseHit(t, 0.06, 'highpass', 2000, 0.12, audio.music);   // drum roll into the song
    return;
  }
  const r = Math.floor((bar - 4) / 16);
  if (r >= KEYS.length) {   // ending: three hits, then one long chord, then silence
    const e = bar - 4 - KEYS.length * 16, key = KEYS[KEYS.length - 1];
    if (e === 0 && (s === 0 || s === 4 || s === 8)) { kick(t, 0.6); for (const m of triad(60 + key, false)) tone(mtof(m), t, st * 2, 'square', 0.04, audio.music); }
    if (e === 1 && s === 0) {
      kick(t, 0.6); noiseHit(t, 1.5, 'highpass', 3000, 0.15, audio.music);
      for (const m of [...triad(48 + key, false), ...triad(60 + key, false), 72 + key]) tone(mtof(m), t, st * 40, m < 60 ? 'triangle' : 'square', m < 60 ? 0.3 : 0.03, [audio.music, audio.echo]);
    }
    return;
  }
  const part = (bar - 4) % 16 < 8 ? VERSE : CHORUS, b = (bar - 4) % 8, key = KEYS[r];
  const root = 48 + part.chords[b] + key, ch = triad(root, [2, 4, 9].includes(part.chords[b]));
  if (s % 2 === 0) tone(mtof((s % 4 === 0 ? ch[0] : ch[0] + 12) - 12), t, st * 1.6, 'triangle', 0.45, audio.music);   // pumping bass
  tone(mtof(ch[s % 3] + 24), t, st * 0.8, 'square', 0.02, audio.music);                                              // arpeggio
  if (s === 0 || s === 8 || (part === CHORUS && (s === 4 || s === 12))) kick(t, 0.5);
  if (s === 4 || s === 12) noiseHit(t, 0.12, 'bandpass', 1800, 0.18, audio.music, 0.8);                            // snare
  if (s % 2 === 0) noiseHit(t, 0.025, 'highpass', 8000, 0.05, audio.music);                                        // hat
  if (s % 2 === 0) {
    const m = part.lead[b][s / 2];
    if (m !== null) {
      let note = 72 + m + key; while (note > 96) note -= 12;
      tone(mtof(note), t, st * 1.8, 'square', 0.04, [audio.music, audio.echo]);
      if (r >= 2) tone(mtof(note - 12), t, st * 1.8, 'triangle', 0.08, audio.music);   // later rounds: a second, lower voice
    }
  }
}

// ---------- effects ----------
// An old dial-up modem: dial tone, three number beeps, then the screeching handshake.
function sfxModem() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime, o = audio.sfx;
  tone(350, t, 0.32, 'sine', 0.07, o); tone(440, t, 0.32, 'sine', 0.07, o);
  [[697, 1209], [770, 1336], [852, 1477]].forEach(([f1, f2], k) => { tone(f1, t + 0.4 + k * 0.1, 0.06, 'sine', 0.07, o); tone(f2, t + 0.4 + k * 0.1, 0.06, 'sine', 0.07, o); });
  for (let k = 0; k < 18; k++) tone(k % 5 === 0 ? 980 : k % 2 ? 1200 : 2100, t + 0.75 + k * 0.03, 0.035, 'square', 0.025, o);
  noiseHit(t + 0.95, 0.45, 'bandpass', 1800, 0.06, o, 3);
  tone(1650, t + 1.25, 0.25, 'sine', 0.03, o, 1500);
}
// A wrong answer or a wrong password: three falling notes.
function sfxWrong() { if (!audio.ctx) return; const t = audio.ctx.currentTime; [440, 392, 311].forEach((f, k) => tone(f, t + k * 0.16, k === 2 ? 0.45 : 0.14, 'square', 0.05, audio.sfx)); }
function sfxBoost() { if (!audio.ctx) return; const t = audio.ctx.currentTime; noiseHit(t, 0.35, 'bandpass', 1200, 0.12, audio.sfx, 2); tone(300, t, 0.3, 'sawtooth', 0.03, audio.sfx, 900); }
// Going through a door: a low slide down into the dark.
function sfxEnter() { if (!audio.ctx) return; const t = audio.ctx.currentTime; tone(220, t, 1.4, 'triangle', 0.08, audio.sfx, 55); noiseHit(t, 1.2, 'lowpass', 500, 0.08, audio.sfx); }
// A cop's whistle: two short, high blasts.
function sfxWhistle() { if (!audio.ctx) return; const t = audio.ctx.currentTime; tone(2600, t, 0.12, 'square', 0.04, audio.sfx, 2900); tone(2600, t + 0.18, 0.28, 'square', 0.04, audio.sfx, 3000); }
// Thrown overboard: a long fall, then crackling bits.
function sfxFall() { if (!audio.ctx) return; const t = audio.ctx.currentTime; tone(900, t, 1.6, 'square', 0.05, audio.sfx, 60); for (let k = 0; k < 14; k++) tone(k % 2 ? 1800 : 2400, t + 1.2 + k * 0.09, 0.04, 'square', 0.03, audio.sfx); }
function sfxClick() { if (audio.ctx) tone(1400, audio.ctx.currentTime, 0.03, 'square', 0.03, audio.sfx); }
function sfxHangup() { if (audio.ctx) tone(900, audio.ctx.currentTime, 0.14, 'square', 0.04, audio.sfx, 300); }
function sfxThunk() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  tone(110, t, 0.12, 'sine', 0.25, audio.sfx, 50); noiseHit(t, 0.06, 'lowpass', 900, 0.15, audio.sfx);
}
function sfxWhir() { if (audio.ctx) tone(180, audio.ctx.currentTime, 0.5, 'sawtooth', 0.03, audio.sfx, 420); }
function sfxDoor() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  for (let k = 0; k < 10; k++) noiseHit(t + k * 0.05, 0.04, 'bandpass', 600 + k * 40, 0.08, audio.sfx, 4);
}
function sfxAlarm() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  for (let k = 0; k < 6; k++) tone(k % 2 ? 660 : 880, t + k * 0.16, 0.14, 'square', 0.05, audio.sfx);
}

// ---------- packets: a whoosh per packet, with Doppler and left/right pan ----------
const voices = new Map();
const VOICE_BASE = { chat: 900, hello: 700, syn: 1300, fin: 500, cmd: 1100, log: 1600 };
function makeVoice(p) {
  const a = audio.ctx;
  const src = a.createBufferSource(); src.buffer = audio.noise; src.loop = true;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
  const osc = a.createOscillator(); osc.type = 'sine';
  const og = a.createGain(); og.gain.value = 0.12;
  const gain = a.createGain(); gain.gain.value = 0;
  const pan = a.createStereoPanner ? a.createStereoPanner() : null;
  src.connect(bp); bp.connect(gain); osc.connect(og); og.connect(gain);
  if (pan) { gain.connect(pan); pan.connect(audio.sfx); } else gain.connect(audio.sfx);
  src.start(0, Math.random() * 1.5); osc.start();
  return { src, bp, osc, gain, pan, base: VOICE_BASE[p.kind] || 1000, last: null };
}
function updatePacketSounds(dt) {
  if (!audio.ctx) return;
  const now = audio.ctx.currentTime;
  const live = new Set();
  if (scene.kind === 'world') {
    const ear = { x: robot.x, y: robot.y - 30 };
    const near = packets.map(p => { const pos = packetPos(p); return { p, pos, d: Math.hypot(pos.x - ear.x, pos.y - ear.y) }; })
      .filter(c => c.d < HEAR).sort((a, b) => a.d - b.d).slice(0, 6);
    for (const c of near) {
      live.add(c.p);
      let v = voices.get(c.p);
      if (!v) { v = makeVoice(c.p); voices.set(c.p, v); }
      // Doppler: coming closer → higher pitch, moving away → lower pitch.
      const vr = v.last === null || dt <= 0 ? 0 : (c.d - v.last) / dt;
      v.last = c.d;
      const dop = Math.max(0.5, Math.min(2, SOUND_C / (SOUND_C + vr)));
      const moving = !(paused || c.p.blocked || simTime < c.p.holdUntil);
      const vol = Math.pow(1 - c.d / HEAR, 2) * (moving ? 0.5 : 0.05) * (c.p.kind === 'log' ? 0.5 : 1);
      v.bp.frequency.setTargetAtTime(v.base * dop, now, 0.04);
      v.osc.frequency.setTargetAtTime(v.base * 0.75 * dop, now, 0.04);
      v.gain.gain.setTargetAtTime(vol, now, 0.05);
      if (v.pan) v.pan.pan.setTargetAtTime(Math.max(-1, Math.min(1, (c.pos.x - ear.x) / 500)), now, 0.05);
    }
  }
  for (const [p, v] of voices) {
    if (live.has(p)) continue;
    v.gain.gain.setTargetAtTime(0, now, 0.05); v.src.stop(now + 0.3); v.osc.stop(now + 0.3);
    voices.delete(p);
  }
}

document.getElementById('btnLayout').onclick = resetLayout;

// Maximize: the whole page goes full screen (Esc or the button again leaves it).
const btnMax = document.getElementById('btnMax');
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFull() {
  const el = document.documentElement;
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
btnMax.onclick = toggleFull;
document.getElementById('appTitle').addEventListener('dblclick', toggleFull);   // like a Windows 95 title bar
function onFullChange() {
  const full = isFull();
  btnMax.textContent = full ? '❐' : '□';
  btnMax.title = full ? 'Restore (leave full screen)' : 'Maximize (full screen)';
  document.getElementById('app').classList.toggle('full', full);
}
document.addEventListener('fullscreenchange', onFullChange);
document.addEventListener('webkitfullscreenchange', onFullChange);

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  view.dpr = window.devicePixelRatio || 1;
  view.cw = Math.max(1, r.width); view.ch = Math.max(1, r.height);
  cv.width = Math.round(view.cw * view.dpr); cv.height = Math.round(view.ch * view.dpr);
  view.base = Math.min(view.cw / VIEW_W, view.ch / VIEW_H);
  view.zoom = view.base * (view.mul || 1);
}
// The package view zooms in a little; the zoom eases in and out.
function updateZoom(dt) {
  view.mul = view.mul || 1;
  view.mul += ((pkgRide ? 1.25 : 1) - view.mul) * (1 - Math.exp(-3 * dt));
  view.zoom = view.base * view.mul;
}
new ResizeObserver(() => { resize(); updateCamera(1); render(performance.now()); }).observe(cv.parentElement);
resize();

const st1 = document.getElementById('st1'), st2 = document.getElementById('st2');
function updateStatus() {
  const where = fall ? 'lost in cyberspace' : scene.kind === 'inside' ? `inside the ${roomOf().name} of Node ${scene.node}` : robot.ride ? 'riding the cable' : `on Node ${boardAt(robot.x, robot.y) || '?'}`;
  const al = ['A', 'B'].filter(alert).map(n => ` · Node ${n} ON ALERT`).join('');
  const boost = (progress.watcher ? 'node_watcher · ' : '') + (robot.boostWait > 0 ? `boost in ${Math.ceil(robot.boostWait)} s` : 'boost ready');
  st1.textContent = `Simulation: ${paused ? 'paused' : 'running'} · ${speed}× · connection: ${tcp === 'up' ? 'open' : 'none'} · robot: ${where} · ${boost}${al}`;
  const bl = ['A', 'B'].map(n => `${n} ${defense[n].blocks}`).join(', ');
  st2.textContent = `Machines found: ${know.metInst.size}/12 · Questions: ${know.asked.size}/${TOTAL_TOPICS} · Stations seen: ${know.stations.size}/${ALL_STATIONS} · Quizzes passed: ${progress.passed.size}/${ORDER.length} · Blocks: ${bl}`;
}

spawn(scenario());
let lastNow = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  let simDt = paused ? 0 : dt * speed;
  if (paused && stepBudget > 0) { simDt = Math.min(stepBudget, dt * 2); stepBudget -= simDt; }
  if (simDt > 0) {
    simTime += simDt * 1000;
    updatePackets(simDt);
    for (const t of tasks.slice()) if (!t.done) runTask(t);
    tasks = tasks.filter(t => !t.done);
    for (const r of Object.values(ROOMS)) if (r.update) { r.update('A', simDt); r.update('B', simDt); }
    updateSwarm(simDt);
  }
  updateFade(dt);
  updateRide(dt);
  updateGuard(dt);
  updateRobot(dt);
  updateCop(dt);
  updateFinale(dt);
  reveal();
  updateZoom(dt);
  updateCamera(dt);
  updateDialog(dt);
  updatePacketSounds(dt);
  drawAvatars(now);
  updateStatus();
  render(now);
  requestAnimationFrame(frame);
}
if (location.hash === '#inside') enterRoom(P['A.log']);   // shortcut: open the page as index.html#inside to start in the LogWriter
reveal(); snapCamera(); updateStatus(); render(performance.now());
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
